function win(){SFX.win();confetti();var p=cur.par,st=moves<=p?3:moves<=Math.ceil(p*1.35)?2:1,h='';
 if(isDaily){var d=today();SV.daily[d]=Math.max(SV.daily[d]||0,st);save();h='<h2>Daily Special sold out!</h2><div class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><p>'+moves+' moves · par '+p+'</p><button class="btn" onclick="closeM();show(\'title\')">Back to shop</button>'}
 else{var prev=SV.stars[lvIdx];var newT=TAPES.filter(function(t){return t.need===cleared()+1&&prev==null});SV.stars[lvIdx]=Math.max(prev||0,st);save();
  h='<h2>'+cur.name+' sold out! 🧁</h2><div class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><p>'+moves+' moves · par '+p+(st<3?' — 3★ at '+p+' or fewer':'')+'</p>'+
  (newT.length?'<p>📻 New radio track unlocked: <b>'+newT[0].name+'</b></p>':'')+
  (lvIdx<LEVELS.length-1?'<button class="btn" onclick="closeM();play('+(lvIdx+1)+')">Next case ▶</button>':'<p><b>Every case sold out — you run the best bakery in town!</b></p>')+
  '<br><button class="btn sm cream" onclick="closeM();play('+lvIdx+')">Replay</button><button class="btn sm cream" onclick="closeM();show(\'levels\')">Levels</button>'}
 modal(h)}
function modal(h){document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeM(){document.getElementById('modal').classList.remove('on')}
function confetti(){var cols=['#ff8fb1','#ffe066','#8ea6ff','#7ee8c6','#c9adff','#fff'];for(var i=0;i<60;i++){var d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.5+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(function(x){x.remove()}.bind(null,d),4500)}}
function render(){var c=document.getElementById('case'),n=S.t.length;c.innerHTML='';
 var W=c.clientWidth-16,H=c.clientHeight-24,best=40,bestR=1;
 for(var rows=1;rows<=3;rows++){var per=Math.ceil(n/rows);var w=Math.min((W-per*8)/per,((H-rows*12)/rows-60)/(4*.78+.5),96);if(w>best){best=w;bestR=rows}}
 c.style.setProperty('--w',Math.floor(best)+'px');
 S.t.forEach(function(t,i){var d=document.createElement('div');d.className='stand'+(i===sel?' sel':'')+(BC.full(t,S.cap)?' done':'')+(t.flip&&S.flips>0&&!t.lock?' canflip':'');
  var col='<div class="col">',runC=t.b.length?t.b[t.b.length-1].c:-1,run=true;
  for(var k=t.b.length-1;k>=0;k--){}
  var items=t.b.map(function(it,k){var up=false;return {it:it,k:k}});
  var upFrom=t.b.length;for(var k=t.b.length-1;k>=0&&t.b[k].c===runC&&!t.b[k].ice;k--)upFrom=k;
  t.b.forEach(function(it,k){col+='<div class="it'+(it.ice?' ice':'')+(k>=upFrom?' up':'')+'">'+svgItem(it.c)+'</div>'});
  col+='</div>';var lab=BC.full(t,S.cap)?FL[t.b[0].c%FL.length].n:t.lock?'closed':t.b.length?'Tier '+(i+1):'empty';
  d.innerHTML=col+'<div class="plate"></div><div class="stem"></div><div class="foot"></div><div class="lab">'+lab+'</div>'+(t.lock?'<div class="lockc"><span>🔒 CLOSED<br>sell out 1</span></div>':'')+(t.flip?'<div class="fb">↻</div>':'');
  d.onclick=function(){tap(i)};c.appendChild(d)});
 document.getElementById('mv').textContent=moves;document.getElementById('par').textContent=cur.par;document.getElementById('lvlname').textContent=cur.name;
 var hasF=S.t.some(function(t){return t.flip});var bf=document.getElementById('bFlip');bf.style.display=hasF?'':'none';document.getElementById('fl').textContent='×'+S.flips;bf.disabled=!S.flips;
 document.getElementById('bUndo').disabled=!hist.length}
window.addEventListener('resize',function(){if(S&&document.getElementById('game').classList.contains('on'))render()});
// ---- daily ----
function today(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function daily(){var d=today(),L={colors:7,empty:2,spare:0,shuffle:2,ice:3,flipT:2,flips:2,locks:1};
 for(var k=0;k<40;k++){var s=BC.make(L,BC.rng(d*97+k));if(BC.won(s))continue;var sol=BC.solve(BC.clone(s),40000);if(sol){isDaily=true;load(s,sol.length>40?Math.round(sol.length*.8):sol.length,'Daily '+String(d).slice(4,6)+'/'+String(d).slice(6));toast('📅 Today’s Daily Special — same case for everyone today'+(SV.daily[d]?' (best ★'+SV.daily[d]+')':''));return}}
 toast('Daily oven is warming up — try a level instead')}
// ---- settings ----
function openSet(){var h='<h2>Settings</h2><label class="row">Sound effects <input type="checkbox" '+(SV.sfx?'checked':'')+' onchange="SV.sfx=this.checked?1:0;save()"></label>'+
 '<label class="row">SFX volume <input type="range" min="0" max="1" step=".05" value="'+SV.sfxVol+'" oninput="SV.sfxVol=+this.value;save()" onchange="SFX.place(2)"></label>'+
 '<label class="row">Music volume <input type="range" min="0" max="1" step=".05" value="'+SV.musVol+'" oninput="SV.musVol=+this.value;save();if(SV.musVol>0){MUS.setVol(SV.musVol);if(!MUS.playing())MUS.play(SV.track)}else MUS.stop()"></label>'+
 '<h3>📻 Bakery Radio</h3>'+TAPES.map(function(t){var ok=musOk(t);return '<div class="trk'+(SV.track===t.id?' on':'')+(ok?'':' lock')+'" onclick="'+(ok?'SV.track=\''+t.id+'\';save();startMusic();openSet()':'toast(\'Sell out '+t.need+' cases to unlock\')')+'"><span class="dot" style="background:'+t.col+'"></span><b>'+t.name+'</b><small style="flex:1;text-align:right">'+(ok?t.genre:'🔒 '+t.need+' cases')+'</small></div>'}).join('')+
 '<br><button class="btn" onclick="closeM()">Done</button>';modal(h);ctx()}
function credits(){modal('<h2>Credits</h2><p><b>Bakery Cases</b> v'+VER+'</p><p>Design, code, art & music:<br><b>Retro Gaming Dad</b><br>Arthur McConnell</p><p>All music is original WebAudio, composed for this game.</p><p>Thanks for playtesting! 🧁</p><button class="btn" onclick="closeM()">Close</button>')}
document.addEventListener('pointerdown',function f(){ctx();if(SV.musVol>0)startMusic();document.removeEventListener('pointerdown',f)},{once:true});
titleInfo();var hm=location.hash.match(/play=(\d+)/);if(hm)play(+hm[1]);
</script></body></html>
