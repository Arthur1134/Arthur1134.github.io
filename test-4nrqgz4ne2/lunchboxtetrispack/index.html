/* ---------- core rules (pure; no DOM) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(cells){let mx=99,my=99;for(const [x,y] of cells){mx=Math.min(mx,x);my=Math.min(my,y)}return cells.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0])}
function rotCells(cells){return norm(cells.map(([x,y])=>[-y,x]))}
function pieceRots(it){const out=[];let c=norm(ITEMS[it].s);for(let r=0;r<4;r++){const k=JSON.stringify(c);if(!out.some(o=>JSON.stringify(o)===k))out.push(c);c=rotCells(c)}return out}
const ROTS={};for(const k in ITEMS)ROTS[k]=pieceRots(k);
const SP_EARN_CAP=3;
function remainingEarnable(S){return Math.max(0,SP_EARN_CAP-(S.spEarned||0))}
function achievableSporks(S){return (S.sp||0)+remainingEarnable(S)}
function antNeed(S){return S.orders.reduce((a,o)=>o.t==='ant'?a+Math.max(0,o.n-o.have):a,0)}
function canAffordSquish(S){if(S.sp<=0)return false;const need=antNeed(S);if(need<=0)return false;return (S.sp-1)+remainingEarnable(S)>=need-1}
function maybeJam(S){if(S.complete||S.over||anyMove(S))return;if(S.sp>0)S.ev.push({type:'jamhint'});else{S.over=true;S.reason='jam';S.ev.push({type:'over',why:'jam'})}}

function pdim(cells){let w=0,h=0;for(const [x,y] of cells){w=Math.max(w,x+1);h=Math.max(h,y+1)}return[w,h]}
function mkPiece(S,it){return{it,cells:ROTS[it][0],r:0,id:++S.pidN}}
function rotatePiece(p){const R=ROTS[p.it];p.r=(p.r+1)%R.length;p.cells=R[p.r];return p}

 orders:L.ord.map(o=>({t:o[0],g:typeof o[1]==='string'?o[1]:null,n:typeof o[1]==='string'?o[2]:o[1],have:0})),
 st:{packs:0,bal:0,sup:0,cups:0,ants:0,stk:0,ice:0,cells:0,placed:0,sporks:0,rot:0},kidN:0,lunches:0};
 const ids={};for(let y=0;y<8;y++)for(let x=0;x<8;x++){const ch=lay[y][x];if(ch==='#')continue;if(!(ch in ids)){ids[ch]=S.comps.length;S.comps.push({id:S.comps.length,cells:[]})}S.comp[y*8+x]=ids[ch];S.comps[ids[ch]].cells.push(y*8+x)}
 for(const [x,y] of (L.ice||[]))S.grid[y*8+x]={ice:2,pid:0};
 for(const [x,y] of (L.stk||[]))S.stk[y*8+x]=1;
 if(S.endless){S.orders=[];nextKid(S)}
 for(let i=0;i<3;i++)S.tray[i]=draw(S);return S}
function nextKid(S){S.kidN++;S.spEarned=0;const r=S.rng,k=S.kidN;const opts=[['pack',2+Math.min(3,k>>1)],['bal',1+Math.min(3,k>>2)],['eat',HEALTHY[Math.floor(r()*5)],4+Math.min(8,k)],['grp',HEALTHY[Math.floor(r()*5)],1]];
 if(k>3){const maxA=achievableSporks(S);if(maxA>0)opts.push(['ant',Math.min(maxA,1+Math.min(3,k>>2))])}if(k>5)opts.push(['sup',1]);
 const o=opts[Math.floor(r()*opts.length)];S.orders=[{t:o[0],g:typeof o[1]==='string'?o[1]:null,n:typeof o[1]==='string'?o[2]:o[1],have:0}];S.kid=KIDS_E[(k-1)%KIDS_E.length]}
function endlessPool(S){const p=Object.assign({},P_STD);const k=S.placed;if(k>25)Object.assign(p,{cookie:2,brownie:2,cupcake:1});if(k>45)Object.assign(p,{thermos:2,pizza:2});if(k>80){p.grape=1;p.cheese=1;p.egg=1;p.hoagie=1}return p}
function pickItem(S){const pool=Object.assign({},S.endless?endlessPool(S):S.L.pool);for(const o of S.orders)if((o.t==='grp'||o.t==='eat')&&o.have<o.n)for(const k in pool)if(ITEMS[k].g===o.g)pool[k]*=1.7;let tot=0;for(const k in pool)tot+=pool[k];let v=S.rng()*tot;for(const k in pool){v-=pool[k];if(v<=0)return k}return Object.keys(pool)[0]}
function fitsAnywhere(S,it){for(const cells of ROTS[it])for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(canPlace(S,cells,x,y))return true;return false}
function draw(S){const tries=S.endless?(S.placed>60?2:3):(S.L.mercy||4);let it;for(let i=0;i<tries;i++){it=pickItem(S);if(fitsAnywhere(S,it))break}return mkPiece(S,it)}
function canPlace(S,cells,x,y){let cid=-2;for(const [dx,dy] of cells){const cx=x+dx,cy=y+dy;if(cx<0||cy<0||cx>7||cy>7)return false;const i=cy*8+cx;if(S.comp[i]<0||S.grid[i])return false;if(cid===-2)cid=S.comp[i];else if(S.comp[i]!==cid)return false}return true}
function anyMove(S){for(const p of S.tray.concat([S.bag]))if(p&&fitsAnywhere(S,p.it))return true;return false}
function compFull(S,c){return c.cells.every(i=>S.grid[i])}
/* place piece from slot (0-2 tray, 3 bag) at x,y */
function place(S,slot,x,y,cellsOverride){const p=slot===3?S.bag:S.tray[slot];if(!p||S.over||S.complete)return false;const cells=cellsOverride||p.cells;if(!canPlace(S,cells,x,y))return false;
 const ic=[];for(const [dx,dy] of cells){const i=(y+dy)*8+x+dx;S.grid[i]={it:p.it,g:ITEMS[p.it].g,pid:p.id};ic.push(i)}
 S.score+=cells.length*5;S.placed++;S.st.placed++;S.st.cells+=cells.length;if(S.left!==Infinity)S.left--;
 S.ev.push({type:'place',cells:ic,it:p.it});
 if(slot===3)S.bag=null;else{S.tray[slot]=null;const vis=S.tray.filter(Boolean).length;S.tray[slot]=(S.left===Infinity||S.left>vis)?draw(S):null}
 const cid=S.comp[ic[0]];let packed=0;S.sincePack++;
