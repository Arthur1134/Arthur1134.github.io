/* ---------- floor simulation (pure; no DOM) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KID_R=9,CAB_W=46,CAB_H=54;
const DAILY_MODS=[{id:'double',n:'DOUBLE TICKET DAY',d:'ALL TICKETS x2'},{id:'rain',n:'TOKEN RAIN',d:'TOKENS DROP TWICE AS OFTEN'},{id:'cops',n:'COP CONVENTION',d:'+2 COPS, TICKETS x1.5'},
 {id:'slip',n:'SLIP N SLIDE',d:'+2 JANITORS, PUDDLES EVERYWHERE'},{id:'gold',n:'GOLD RUSH',d:'EVERY CABINET IS GOLD'},{id:'turbo',n:'TURBO TUESDAY',d:'YOU RUN 25% FASTER, LESS TIME'}];
function dayKey(d){d=d||new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function buildLevel(idx,seed,up){// idx>=0 campaign, -1 daily, -2 endless
 const rng=mulberry(seed*7919+13);let L,mod=null;
 if(idx>=0)L=LEVELS[idx];
 else{const dk=idx===-1?seed:seed;const r2=mulberry(dk*31+7);const a=Math.floor(r2()*3);const n=idx===-1?9:8;const cab=[];for(let i=0;i<n;i++){let t=MINI_KEYS[Math.floor(r2()*MINI_KEYS.length)];if(r2()<.2)t+='*';cab.push(t)}
  if(idx===-1){mod=DAILY_MODS[Math.floor(r2()*DAILY_MODS.length)];if(mod.id==='gold')for(let i=0;i<cab.length;i++)if(!cab[i].endsWith('*'))cab[i]+='*'}
  L={a,n:idx===-1?'DAILY RUN':'OVERTIME',cab,time:idx===-1?90:60,tok:7,cops:idx===-1?1:0,jan:1,conga:a>0?1:0,gull:a===2?1:0,target:[0,0,0]};
  if(mod&&mod.id==='cops')L.cops+=2;if(mod&&mod.id==='slip')L.jan+=2;if(mod&&mod.id==='turbo')L.time=75}
 return{L,mod}}
function newState(idx,seed,up){up=up||{};const {L,mod}=buildLevel(idx,seed,up);const A=AREAS[L.a],M=MAPS[A.id];
 const S={idx,L,mod,A,M,seed,rng:mulberry(seed*104729+idx*17+5),endless:idx===-2,daily:idx===-1,up,
  t:L.time+6*(up.watch||0),maxT:L.time+6*(up.watch||0),elapsed:0,kid:{x:M.spawn[0],y:M.spawn[1],vx:0,vy:0,stun:0,slip:0,face:0,moving:false,inv:0},
  tokens:L.tok+(up.pockets||0),tickets:0,obs:[],cabs:[],drops:[],cops:[],jans:[],puds:[],conga:null,gulls:[],ev:[],mini:null,done:false,
  dropT:2,gullT:6,streak:0,lastType:'',plays:0,caught:0,st:{plays:0,jack:0,caught:0,slips:0,tokens:0,gold:0,best:0,steals:0,bumps:0},cont:false,bonus:false,hurry:false};
 for(const o of M.obs)S.obs.push({x:o[0],y:o[1],w:o[2],h:o[3],k:o[4]});
 L.cab.forEach((c,i)=>{const sl=M.slots[i];if(!sl)return;const gold=c.endsWith('*'),type=gold?c.slice(0,-1):c;const f=sl[2];const w=(f==='l'||f==='r')?CAB_H:CAB_W,h=(f==='l'||f==='r')?CAB_W:CAB_H;
  const cb={i,type,tier:gold?3:1,cost:gold?2:1,x:sl[0],y:sl[1],w,h,face:f,cool:0,plays:0};const D=18;
  cb.zone=f==='d'?{x:cb.x+6,y:cb.y+h,w:w-12,h:D}:f==='u'?{x:cb.x+6,y:cb.y-D,w:w-12,h:D}:f==='l'?{x:cb.x-D,y:cb.y+6,w:D,h:h-12}:{x:cb.x+w,y:cb.y+6,w:D,h:h-12};S.cabs.push(cb)});
 const nC=Math.min(L.cops,M.cop.length);for(let i=0;i<nC;i++)S.cops.push(mkCop(S,i));
 for(let i=0;i<L.jan;i++){const r=M.jan,k=(i*2)%r.length;S.jans.push({x:r[k][0],y:r[k][1],wp:(k+1)%r.length,pudT:1+i,dir:0})}
 if(L.conga&&M.conga){S.conga={seg:0,f:0,n:6,pts:[]};initConga(S)}

function mkCop(S,i){const r=S.M.cop;const k=(i*2+1)%r.length;return{x:r[k][0],y:r[k][1],wp:(k+1)%r.length,dir:1,state:'patrol',t:0,cd:0,face:0}}
function initConga(S){const P=S.M.conga;S.conga.pts=[];for(let k=0;k<S.conga.n;k++)S.conga.pts.push({x:P[0][0],y:P[0][1]});S.conga.d=0}
function rectHit(x,y,r,o){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));const dx=x-cx,dy=y-cy;return dx*dx+dy*dy<r*r?{dx,dy,cx,cy}:null}
function solid(S){return S.obs.concat(S.cabs)}
function blocked(S,x,y,r){if(x<r||y<r||x>FW-r||y>FH-r)return true;for(const o of solid(S))if(rectHit(x,y,r,o))return true;return false}
function pushOut(S,b,r){b.x=Math.max(r,Math.min(FW-r,b.x));b.y=Math.max(r,Math.min(FH-r,b.y));for(const o of solid(S)){const h=rectHit(b.x,b.y,r,o);if(!h)continue;let d=Math.hypot(h.dx,h.dy);
  if(d<1e-3){// centre inside rect: push along min axis
   const l=b.x-o.x,rr=o.x+o.w-b.x,u=b.y-o.y,dd=o.y+o.h-b.y,m=Math.min(l,rr,u,dd);if(m===l)b.x=o.x-r;else if(m===rr)b.x=o.x+o.w+r;else if(m===u)b.y=o.y-r;else b.y=o.y+o.h+r}
  else{b.x=h.cx+h.dx/d*r;b.y=h.cy+h.dy/d*r}}}
function kidSpeed(S){return 112*(1+.1*(S.up.shoes||0))*(S.mod&&S.mod.id==='turbo'?1.25:1)}
function inZone(k,z){return k.x>z.x-4&&k.x<z.x+z.w+4&&k.y>z.y-4&&k.y<z.y+z.h+4}
function freeSpot(S){for(let n=0;n<40;n++){const x=24+S.rng()*(FW-48),y=90+S.rng()*(FH-170);if(!blocked(S,x,y,14)&&Math.hypot(x-S.kid.x,y-S.kid.y)>50)return{x,y}}return null}
function tickMult(S){let m=1+.1*(S.up.luck||0);if(S.mod){if(S.mod.id==='double')m*=2;if(S.mod.id==='cops')m*=1.5}return m}
/* input: {mx,my} desired direction (len<=1) */
function floorStep(S,dt,inp){if(S.done)return;S.elapsed+=dt;S.t-=dt;
 if(S.endless){/* escalate */const e=S.elapsed;const wantC=Math.min(3,Math.floor(e/35));while(S.cops.length<wantC&&S.cops.length<S.M.cop.length){S.cops.push(mkCop(S,S.cops.length));S.ev.push({type:'copin'})}if(e>50)S.gullN=Math.max(S.gullN,1)}
 if(!S.hurry&&S.t<=15&&!S.endless||S.endless&&!S.hurry&&S.t<=10){S.hurry=true;S.ev.push({type:'hurry'})}else if(S.hurry&&S.t>16)S.hurry=false;
 if(S.t<=0){S.t=0;if(!S.mini){S.done=true;S.ev.push({type:'closed'})}return}
 if(S.mini)return;// floor frozen while in a cabinet (clock keeps running)
 const k=S.kid,sp=kidSpeed(S);if(k.inv>0)k.inv-=dt;
 if(k.stun>0){k.stun-=dt;k.vx*=.8;k.vy*=.8;k.moving=false}
 else if(k.slip>0){k.slip-=dt;k.vx+=(inp.mx||0)*sp*dt*1.2;k.vy+=(inp.my||0)*sp*dt*1.2;const v=Math.hypot(k.vx,k.vy);if(v>sp*1.3){k.vx*=sp*1.3/v;k.vy*=sp*1.3/v}k.moving=true}
 else{let mx=inp.mx||0,my=inp.my||0;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}const tvx=mx*sp,tvy=my*sp;const a=Math.min(1,dt*14);k.vx+=(tvx-k.vx)*a;k.vy+=(tvy-k.vy)*a;k.moving=l>.15;if(l>.15)k.face=Math.atan2(my,mx)}
 k.x+=k.vx*dt;k.y+=k.vy*dt;pushOut(S,k,KID_R);
 // puddles
 for(const p of S.puds){p.t-=dt;if(k.slip<=0&&k.stun<=0&&Math.hypot(k.x-p.x,k.y-p.y)<p.r&&Math.hypot(k.vx,k.vy)>40&&k.inv<=0){k.slip=.75;k.inv=.2;const v=Math.hypot(k.vx,k.vy)||1;k.vx=k.vx/v*sp*1.3;k.vy=k.vy/v*sp*1.3;S.st.slips++;S.ev.push({type:'slip',x:k.x,y:k.y})}}
