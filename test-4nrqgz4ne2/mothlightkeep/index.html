<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mothlight Keep v0.1.1 - Retro Gaming Dad</title>
<style>
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;touch-action:none;font-family:'Courier New',monospace}
canvas{display:block;margin:0 auto;background:#120a22;image-rendering:auto}
</style></head><body>
<canvas id="c"></canvas>
<script>
/* ===== RUN Ads SDK stubs (wire to real RUN SDK at deploy time) ===== */
const RunAds={
  sdk(){return window.RundotGameAPI&&window.RundotGameAPI.ads?window.RundotGameAPI.ads:null},
  async showInterstitial(){const s=this.sdk();console.log('[RunAds] interstitial');
    if(s&&s.showInterstitialAd){try{await s.showInterstitialAd()}catch(e){console.warn(e)}}return true},
  async showRewarded(){const s=this.sdk();console.log('[RunAds] rewarded');
    if(s&&s.showRewardedAdAsync){try{return !!(await s.showRewardedAdAsync())}catch(e){console.warn(e);return false}}
    return true /* stub: grant reward locally */}
};
/* ===== Mothlight Keep ===== */
const VERSION='0.1.1',W=360,H=640,N=5,CS=64,OX=20,OY=96,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='square',v=.05){try{const o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.value=f;a.gain.value=v;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const MOTHS=[{k:'scout',n:'SCOUT',c:'#7cf4ff',r:2},{k:'burn',n:'BURN',c:'#ff8a3d',r:1},{k:'block',n:'BLOCK',c:'#c58bff',r:1}];
let state='title',level=1,turn,maxTurn,oil,lit,shadows,moths,sel,cur,acted,msg,best=+localStorage.mkBest||0,adUsed,levels=0,score=0,fx=[];
const H0=[2,2];
function key(x,y){return y*N+x}
function startLevel(){lit=new Set([key(2,2)]);shadows=[];turn=1;maxTurn=8+level*2;oil=4;adUsed=false;
 moths=[{t:0,x:2,y:1},{t:1,x:1,y:2},{t:2,x:3,y:2}].map(m=>({...m,x:2,y:2}));moths[0].x=2;moths[0].y=2;
 for(const m of moths){m.x=2;m.y=2}sel=0;cur=[2,2];acted=new Set();msg='Light rooms. Moths follow the glow.';spawnPlan();state='play'}
let plan=[];
function edges(){const e=[];for(let i=0;i<N;i++){e.push([i,0],[i,N-1]);if(i>0&&i<N-1)e.push([0,i],[N-1,i])}return e}
function spawnPlan(){plan=[];const c=Math.min(1+Math.floor((turn+level)/3),5),e=edges().filter(([x,y])=>!lit.has(key(x,y)));for(let i=0;i<c&&e.length;i++)plan.push(e.splice(Math.random()*e.length|0,1)[0])}
const dist=(a,b,c,d)=>Math.abs(a-c)+Math.abs(b-d);
function mothAt(x,y,t){return moths.find(m=>m.x==x&&m.y==y&&(t==null||m.t==t))}
function canMove(m,x,y){if(acted.has(m.t))return false;const d=dist(m.x,m.y,x,y);return d>0&&d<=MOTHS[m.t].r&&lit.has(key(x,y))}
function canLight(x,y){if(oil<1||lit.has(key(x,y)))return false;return [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>lit.has(key(x+a,y+b))&&x+a>=0&&x+a<N&&y+b>=0&&y+b<N)}
function act(x,y){if(state!='play')return;cur=[x,y];const m=moths[sel];
 const om=moths.find(q=>q.x==x&&q.y==y&&q!==m&&!acted.has(q.t));
 if(canMove(m,x,y)){m.x=x;m.y=y;acted.add(m.t);beep(660);burnCheck();msg=MOTHS[m.t].n+' moth flutters over.';nextSel();return}
 if(canLight(x,y)){oil--;lit.add(key(x,y));beep(880,.15,'triangle');msg='Lantern lit! Oil '+oil;return}
 if(om){sel=om.t;beep(440);return}
 msg=lit.has(key(x,y))?'Too far for '+MOTHS[m.t].n+'.':'Light next to a glowing room (1 oil).'}
function nextSel(){for(let i=1;i<=3;i++){const t=(sel+i)%3;if(!acted.has(t)){sel=t;return}}}
function burnCheck(){for(const m of moths)if(m.t==1){const before=shadows.length;shadows=shadows.filter(s=>!(dist(s.x,s.y,m.x,m.y)==0));const k=before-shadows.length;if(k){score+=k*10;beep(220,.2,'sawtooth');fx.push({x:m.x,y:m.y,t:20});}}}
function endTurn(){if(state!='play')return;
 // shadows move toward nearest lantern
 for(const s of shadows){let tg=null,bd=99;for(const k of lit){const x=k%N,y=k/N|0,d=dist(s.x,s.y,x,y);if(d<bd){bd=d;tg=[x,y]}}
  if(!tg||bd==0)continue;const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[s.x+a,s.y+b]).filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N&&!mothAt(x,y,2)&&dist(x,y,tg[0],tg[1])<bd);
  if(opts.length){const o=opts[Math.random()*opts.length|0];s.x=o[0];s.y=o[1]}}
 burnCheck();
 // shadows eat lanterns
 for(const s of shadows){const k=key(s.x,s.y);if(lit.has(k)&&!mothAt(s.x,s.y,1)){if(s.x==2&&s.y==2){lose();return}lit.delete(k);s.dead=true;beep(110,.3,'sawtooth');msg='A shadow snuffed a lantern!'}}
 shadows=shadows.filter(s=>!s.dead);
 for(const m of moths)if(!lit.has(key(m.x,m.y))){m.x=2;m.y=2}
 for(const[x,y]of plan)if(!mothAt(x,y,2))shadows.push({x,y});
 turn++;if(turn%2==0)oil++;acted.clear();sel=0;
 if(turn>maxTurn){win();return}spawnPlan();beep(330)}
async function win(){score+=50+lit.size*5;levels++;state='win';beep(523,.2);setTimeout(()=>beep(784,.3),150);if(score>best){best=score;localStorage.mkBest=best}}
function lose(){state='over';if(score>best){best=score;localStorage.mkBest=best}beep(90,.6,'sawtooth')}
async function nextLevel(){level++;if(levels%2==0)await RunAds.showInterstitial();startLevel()}
async function adOil(){if(adUsed||state!='play')return;const ok=await RunAds.showRewarded();if(ok){oil+=3;adUsed=true;msg='Reward: +3 oil!'}}
async function restart(){await RunAds.showInterstitial();level=1;score=0;levels=0;startLevel()}
// buttons
const BTN=[{x:20,y:440,w:100,h:44,l:'SCOUT',f:()=>sel=0,m:0},{x:130,y:440,w:100,h:44,l:'BURN',f:()=>sel=1,m:1},{x:240,y:440,w:100,h:44,l:'BLOCK',f:()=>sel=2,m:2},
 {x:20,y:496,w:155,h:48,l:'END TURN (E)',f:endTurn},{x:185,y:496,w:155,h:48,l:'AD: +3 OIL',f:adOil}];
function tap(px,py){AC.resume();if(state=='title'){startLevel();return}if(state=='win'){nextLevel();return}if(state=='over'){if(py>330&&py<380)restart();else if(py>390&&py<440&&false);else restart();return}
 for(const b of BTN)if(px>b.x&&px<b.x+b.w&&py>b.y&&py<b.y+b.h){b.f();beep(500,.04);return}
 const x=Math.floor((px-OX)/CS),y=Math.floor((py-OY)/CS);if(x>=0&&y>=0&&x<N&&y<N)act(x,y)}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)});
addEventListener('keydown',e=>{AC.resume();const k=e.key;if(state!='play'){if(k==' '||k=='Enter')tap(180,350);return}
 if(k=='1')sel=0;if(k=='2')sel=1;if(k=='3')sel=2;if(k=='Tab'){e.preventDefault();nextSel()}
 const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[k];
 if(d){e.preventDefault();cur=[Math.max(0,Math.min(N-1,cur[0]+d[0])),Math.max(0,Math.min(N-1,cur[1]+d[1]))]}
 if(k==' '||k=='Enter'){e.preventDefault();act(cur[0],cur[1])}if(k=='e'||k=='E')endTurn();if(k=='r'||k=='R')adOil()});
let tick=0;
function txt(s,x,y,c='#fff',sz=14,al='center',glow=0){g.fillStyle=c;g.font='bold '+sz+'px Courier New';g.textAlign=al;if(glow){g.shadowColor=c;g.shadowBlur=glow}g.fillText(s,x,y);g.shadowBlur=0}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const DUST=Array.from({length:60},(_,i)=>({x:(i*97.3)%W,y:(i*53.7)%H,s:.2+(i%5)*.12,p:i}));
const STONE=Array.from({length:N*N},(_,i)=>{let r=Math.sin(i*91.7)*1e4;r-=Math.floor(r);return {c:r,v:(r*7|0)%3}});
function bg(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0d0620');gr.addColorStop(.5,'#1b0f36');gr.addColorStop(1,'#0a0518');g.fillStyle=gr;g.fillRect(0,0,W,H);
 // castle silhouette
 g.fillStyle='#160c2c';for(let i=0;i<9;i++){const x=i*44-8,h=40+((i*37)%5)*14;g.fillRect(x,H-h,40,h);for(let k=0;k<4;k++)g.fillRect(x+k*11,H-h-7,6,7)}
 g.fillStyle='#ffd85e';g.globalAlpha=.4;for(let i=0;i<9;i++)if(i%2)g.fillRect(i*44+12,H-28-((i*37)%5)*8,4,7);g.globalAlpha=1;
 for(const d of DUST){const y=(d.y-tick*d.s+H*4)%H,x=d.x+Math.sin(tick/40+d.p)*10;g.fillStyle=`rgba(255,${200+(d.p%3)*20},150,${.25+.25*Math.sin(tick/20+d.p)})`;g.fillRect(x,y,2,2)}}
function lamp(cx,cy,f){const gl=g.createRadialGradient(cx,cy,2,cx,cy,30);gl.addColorStop(0,`rgba(255,240,170,${.9*f})`);gl.addColorStop(1,'rgba(255,180,60,0)');g.fillStyle=gl;g.fillRect(cx-30,cy-30,60,60);
 g.fillStyle='#4a2c10';g.fillRect(cx-6,cy-12,12,3);g.fillRect(cx-1,cy-16,2,4);g.fillStyle='#ffe9a0';rr(cx-5,cy-9,10,15,3);g.fill();g.fillStyle='#fff';g.fillRect(cx-1,cy-5+Math.sin(tick/4)*1,2,5);g.fillStyle='#4a2c10';g.fillRect(cx-6,cy+6,12,3)}
function drawMoth(px,py,c,w,dim){g.globalAlpha=dim?.45:1;g.shadowColor=c;g.shadowBlur=dim?0:10;g.fillStyle=c;
 g.beginPath();g.ellipse(px-w/2-1,py-2,w/2+1,5,-.3,0,7);g.ellipse(px+w/2+1,py-2,w/2+1,5,.3,0,7);g.fill();
 g.globalAlpha*=.75;g.beginPath();g.ellipse(px-w/3,py+4,w/3+1,3,.4,0,7);g.ellipse(px+w/3,py+4,w/3+1,3,-.4,0,7);g.fill();g.globalAlpha=dim?.45:1;g.shadowBlur=0;
 g.fillStyle='#fff';rr(px-1.5,py-6,3,12,1.5);g.fill();g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(px,py-6);g.lineTo(px-3,py-10);g.moveTo(px,py-6);g.lineTo(px+3,py-10);g.stroke();g.globalAlpha=1}
function panel(x,y,w,h,col){g.fillStyle='rgba(18,10,34,.88)';rr(x,y,w,h,12);g.fill();g.strokeStyle=col;g.lineWidth=2;g.shadowColor=col;g.shadowBlur=12;g.stroke();g.shadowBlur=0}
function draw(){tick++;bg();
 if(state=='title'){panel(22,110,316,480,'#ffd85e88');lamp(180,90,1+Math.sin(tick/10)*.1);
  txt('MOTHLIGHT',180,170,'#ffd85e',38,'center',16);txt('KEEP',180,215,'#7cf4ff',38,'center',16);
  for(let i=0;i<3;i++)drawMoth(110+i*70,240+Math.sin(tick/8+i)*4,MOTHS[i].c,Math.abs(Math.sin(tick/4+i))*9+5,false);
  const lines=['Light rooms in a crumbling keep.','Moths follow the glow:','SCOUT moves 2 & sees spawns','BURN eats shadows in its room','BLOCK walls shadows out','Shadows snuff lanterns -','protect the HEART lantern!','Survive the turns to win.','','Tap a room / Arrows+Space','1-3 pick moth, E end turn'];
  lines.forEach((l,i)=>txt(l,180,280+i*20,i<1?'#fff':'#c9b8ff',13));txt(Math.sin(tick/15)>0?'TAP OR PRESS SPACE':'',180,520,'#ffd85e',16,'center',10);
  txt('Best '+best+'  v'+VERSION,180,550,'#aaa',12);txt('Made by Arthur McConnell / Retro Gaming Dad',180,610,'#ff8ad8',11);requestAnimationFrame(draw);return}
 // HUD
 const hg=g.createLinearGradient(0,0,0,92);hg.addColorStop(0,'rgba(40,20,70,.95)');hg.addColorStop(1,'rgba(18,10,34,.7)');g.fillStyle=hg;g.fillRect(0,0,W,90);g.fillStyle='#ffd85e55';g.fillRect(0,89,W,1);
 txt('KEEP '+level+'   TURN '+Math.min(turn,maxTurn)+'/'+maxTurn,180,28,'#ffd85e',16,'center',8);
 g.fillStyle='#2a1d3f';rr(40,36,280,8,4);g.fill();g.fillStyle='#ffd85e';rr(40,36,280*Math.min(1,(turn-1)/maxTurn),8,4);g.fill();
 for(let i=0;i<Math.min(oil,12);i++){const ox=24+i*13;g.fillStyle='#ffb347';g.beginPath();g.moveTo(ox,52);g.quadraticCurveTo(ox+5,60,ox,64);g.quadraticCurveTo(ox-5,60,ox,52);g.fill()}
 txt('OIL '+oil,oil>0?Math.min(oil,12)*13+28:24,63,'#ffb347',12,'left');txt('SCORE '+score,340,63,'#7cf4ff',14,'right');
 txt(msg||'',180,82,'#fff',11);
 // keep wall frame
 g.fillStyle='#3b2a52';rr(OX-8,OY-8,N*CS+16,N*CS+16,8);g.fill();g.fillStyle='#2a1d3f';for(let i=0;i<N*CS+16;i+=16){g.fillRect(OX-8+i,OY-8,8,4);g.fillRect(OX-8+i,OY+N*CS+4,8,4)}
 const sc=moths[0];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=OX+x*CS,py=OY+y*CS,L=lit.has(key(x,y)),S=STONE[key(x,y)];
  if(L){const f=.9+Math.sin(tick/9+x*y)*.08;const fg=g.createRadialGradient(px+32,py+30,4,px+32,py+32,46);fg.addColorStop(0,`hsl(45,95%,${68*f}%)`);fg.addColorStop(.6,`hsl(35,85%,${42*f}%)`);fg.addColorStop(1,'#5a2e14');g.fillStyle=fg;g.fillRect(px+2,py+2,CS-4,CS-4)}
  else{g.fillStyle=['#261a3a','#2a1d3f','#231636'][S.v];g.fillRect(px+2,py+2,CS-4,CS-4)}
  g.strokeStyle=L?'rgba(90,40,10,.35)':'rgba(10,5,20,.6)';g.lineWidth=1;g.beginPath();
  for(let r=1;r<4;r++){g.moveTo(px+2,py+r*16);g.lineTo(px+CS-2,py+r*16)}for(let r=0;r<4;r++){const o=r%2?16:0;for(let c=o;c<CS;c+=32){g.moveTo(px+c+8,py+r*16+2);g.lineTo(px+c+8,py+r*16+14)}}g.stroke();
  if(!L){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(px+8,py+10,10,6);g.fillRect(px+40,py+44,14,6);g.fillStyle='rgba(120,90,170,.12)';g.fillRect(px+2,py+2,CS-4,2)}
  if(L)lamp(px+32,py+30,.9+Math.sin(tick/7+x+y)*.1);
  if(x==2&&y==2){const p=1+Math.sin(tick/10)*.15;g.strokeStyle='#ff4f6d';g.lineWidth=3;g.shadowColor='#ff4f6d';g.shadowBlur=12*p;g.strokeRect(px+5,py+5,CS-10,CS-10);g.shadowBlur=0;txt('♥',px+CS/2,py+58,'#ff4f6d',12*p,'center',8)}
  if(state=='play'){const m=moths[sel];if(canMove(m,x,y)){g.fillStyle=`rgba(255,255,255,${.18+.08*Math.sin(tick/8)})`;g.fillRect(px+2,py+2,CS-4,CS-4)}else if(canLight(x,y)){g.strokeStyle='#ffd85e';g.globalAlpha=.55+.3*Math.sin(tick/10);g.setLineDash([4,4]);g.lineDashOffset=-tick/3;g.lineWidth=2;g.strokeRect(px+6,py+6,CS-12,CS-12);g.setLineDash([]);g.globalAlpha=1}}
  if(plan.some(([a,b])=>a==x&&b==y)&&dist(sc.x,sc.y,x,y)<=3){g.fillStyle='rgba(255,40,80,.18)';g.fillRect(px+2,py+2,CS-4,CS-4);txt('!',px+54,py+18,'#ff4f6d',16,'center',8)}}
 // vignette darkness over unlit
 for(const s of shadows){const px=OX+s.x*CS+CS/2,py=OY+s.y*CS+CS/2+Math.sin(tick/8+s.x)*3;
  const sg=g.createRadialGradient(px,py,4,px,py,26);sg.addColorStop(0,'rgba(0,0,0,.95)');sg.addColorStop(.7,'rgba(10,0,20,.8)');sg.addColorStop(1,'rgba(20,0,40,0)');g.fillStyle=sg;g.fillRect(px-26,py-26,52,52);
  g.fillStyle='#05000a';g.beginPath();g.moveTo(px-14,py+14);for(let k=0;k<=6;k++)g.lineTo(px-14+k*28/6,py+14+((k+(tick>>3))%2?5:0));g.arc(px,py,14,0,Math.PI,true);g.fill();
  g.fillStyle='#ff2050';g.shadowColor='#ff2050';g.shadowBlur=8;g.fillRect(px-7,py-4,4,3);g.fillRect(px+3,py-4,4,3);g.shadowBlur=0}
 moths.forEach((m,i)=>{const off=[[-16,-14],[16,-14],[0,16]][i],px=OX+m.x*CS+CS/2+off[0],py=OY+m.y*CS+CS/2+off[1]+Math.sin(tick/5+i)*2,w=Math.abs(Math.sin(tick/4+i))*9+4;
  drawMoth(px,py,MOTHS[m.t].c,w,acted.has(m.t));
  if(i==sel&&state=='play'){g.strokeStyle='#fff';g.lineWidth=1;g.globalAlpha=.6+.4*Math.sin(tick/6);rr(px-15,py-12,30,24,6);g.stroke();g.globalAlpha=1}});
 fx=fx.filter(f=>{f.t--;const cx=OX+f.x*CS+CS/2,cy=OY+f.y*CS+CS/2;g.fillStyle=`rgba(255,${100+f.t*7},0,${f.t/20})`;g.beginPath();g.arc(cx,cy,30-f.t,0,7);g.fill();
  for(let k=0;k<8;k++){const a=k*.785+f.x,r=(20-f.t)*1.6;g.fillStyle=`rgba(255,220,120,${f.t/20})`;g.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3,3)}return f.t>0});
 g.strokeStyle='#fff';g.lineWidth=2;g.shadowColor='#fff';g.shadowBlur=6;rr(OX+cur[0]*CS+1,OY+cur[1]*CS+1,CS-2,CS-2,6);g.stroke();g.shadowBlur=0;
 for(const b of BTN){const on=b.m===sel,dis=(b.m!=null&&acted.has(b.m))||(b.f===adOil&&adUsed);const c=on?MOTHS[b.m].c:dis?'#2a2240':b.f===adOil?'#5a2a66':'#3a2a66';
  const bg2=g.createLinearGradient(0,b.y,0,b.y+b.h);bg2.addColorStop(0,c);bg2.addColorStop(1,dis?'#1e1830':'#1d1238');g.fillStyle=on?c:bg2;rr(b.x,b.y,b.w,b.h,10);g.fill();
  g.strokeStyle=on?'#fff':'rgba(255,255,255,.18)';g.lineWidth=on?2:1;if(on){g.shadowColor=c;g.shadowBlur=14}g.stroke();g.shadowBlur=0;
  if(b.m!=null)drawMoth(b.x+16,b.y+b.h/2,on?'#120a22':MOTHS[b.m].c,7,dis);txt(b.l,b.x+b.w/2+(b.m!=null?8:0),b.y+b.h/2+5,on?'#120a22':dis?'#777':'#fff',13)}
 txt('Tap glowing room = move · dashed = light (1 oil)',180,566,'#c9b8ff',10);txt('Made by Arthur McConnell / Retro Gaming Dad  v'+VERSION,180,620,'#ff8ad8',10);
 if(state=='win'||state=='over'){g.fillStyle='rgba(5,2,12,.55)';g.fillRect(0,0,W,H);const c=state=='win'?'#ffd85e':'#ff4f6d';panel(30,220,300,200,c);
  if(state=='win')lamp(180,250,1);txt(state=='win'?'KEEP HELD!':'THE HEART WENT DARK',180,state=='win'?295:280,c,20,'center',12);
  txt('Score '+score+'  Best '+best,180,330,'#fff',14);txt(state=='win'?'Tap / Space: next keep':'Tap / Space: try again',180,375,'#7cf4ff',14,'center',Math.sin(tick/10)>0?8:0)}
 requestAnimationFrame(draw)}
draw();
</script></body></html>
