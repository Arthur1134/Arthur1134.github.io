const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
/* chord-tone melody writer: a 4-bar rhythm motif repeated, stepwise motion between chord tones, cadence on the root */
function genMel(prog,seed,oct){const R=(function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})(seed);
 const RH=['x-x-xx-x','x--xx-x-','x-xxx---','xx-x-x-x','x---x-x-','x-x-x-x-','x--x--x-'];const chs=prog.split(' ').map(chord);const nb=chs.length;
 const mot=[0,1,2,3].map(()=>RH[Math.floor(R()*RH.length)]);const out=[];let prev=12*(oct+1)+chs[0].root+7;
 for(let b=0;b<nb;b++){const ch=chs[b];const rh=b===nb-1?'x---x---':mot[b%4];const tones=[];for(let o=-1;o<=1;o++)for(const iv of ch.t)tones.push(12*(oct+1)+ch.root+iv+12*o);tones.sort((a,b)=>a-b);
  for(let s=0;s<8;s++){const c=rh[s];if(c!=='x'){out.push(c==='-'?'-':'.');continue}
   let best=tones[0],bd=1e9;const want=prev+(R()<.5?-1:1)*(1+Math.floor(R()*4));const avoid=R()<.75;for(const tn of tones){if(avoid&&tn===prev)continue;const d=Math.abs(tn-want);if(d<bd){bd=d;best=tn}}
   if(b===nb-1&&s===4)best=tones.reduce((a,tn)=>Math.abs(tn-prev)<Math.abs(a-prev)&&(tn-ch.root)%12===0?tn:a,tones[3]);
   while(best>12*(oct+2)+5)best-=12;while(best<12*(oct+1)+2)best+=12;prev=best;out.push(NN[best%12]+(Math.floor(best/12)-1))}}
 return out.join(' ')}
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(n){const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return null;return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function chord(s){const m=/^([A-G])([#b]?)(m?)(7?)$/.exec(s);const root=NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);const t=[0,m[3]?3:4,7];if(m[4])t.push(10);return{root,t}}
for(const k in TRACKS){const tr=TRACKS[k];tr.chords=tr.prog.split(' ').map(chord);tr.mel=(tr.mel||genMel(tr.prog,tr.seed||7,tr.oct||5)).split(' ');{const L=tr.chords.length*8;tr.mel=tr.mel.slice(0,L);while(tr.mel.length<L)tr.mel.push('.')}tr.bassP=tr.bass.split(' ');tr.drumP=tr.drum.split(' ')}
function audioInit(){try{if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=AU.ctx=new AC();
 const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);AU.master=c.createGain();AU.master.connect(comp);
 AU.mus=c.createGain();AU.mus.connect(AU.master);AU.sfx=c.createGain();AU.sfx.connect(AU.master);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
 for(const [k,duty] of [['p12',.125],['p25',.25],['p50',.5]]){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++){re[i]=2*Math.sin(i*Math.PI*duty)/(i*Math.PI)}AU.pw[k]=c.createPeriodicWave(re,im)}
 applyVolumes();AU.timer=setInterval(schedule,25);if(AU.want)playMusic(AU.want,true)}catch(e){AU.ctx=null}}
function applyVolumes(){if(!AU.ctx)return;const s=SAVE.set,m=s.mute?0:1;AU.mus.gain.setTargetAtTime(s.music*.42*m*AU.duck,AU.ctx.currentTime,.05);AU.sfx.gain.setTargetAtTime(s.sfx*.8*m,AU.ctx.currentTime,.02)}
function playMusic(name,force){AU.want=name;if(!AU.ctx)return;if(AU.curName===name&&!force)return;AU.curName=name;AU.cur=TRACKS[name]||null;AU.step=0;AU.nextT=AU.ctx.currentTime+.08}
function stopMusic(){AU.cur=null;AU.curName='';AU.want=null}
function schedule(){const c=AU.ctx;if(!c||!AU.cur||c.state!=='running')return;const tr=AU.cur,sd=60/tr.bpm/2;if(AU.nextT<c.currentTime-.3)AU.nextT=c.currentTime+.05;
 while(AU.nextT<c.currentTime+.14){playStep(tr,AU.step,AU.nextT,sd);AU.nextT+=sd;AU.step++}}
function osc(type,f,t,dur,vol,dest,o){const c=AU.ctx,g=c.createGain(),s=c.createOscillator();if(AU.pw[type])s.setPeriodicWave(AU.pw[type]);else s.type=type;s.frequency.setValueAtTime(f,t);
 if(o&&o.to)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
 if(o&&o.vib&&dur>.25){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.008,t+.2);l.connect(lg);lg.connect(s.frequency);l.start(t);l.stop(t+dur+.05)}
 const a=o&&o.a||.006;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setTargetAtTime(vol*(o&&o.sus!=null?o.sus:.55),t+a,.06);g.gain.setTargetAtTime(0,t+dur,.03);
 s.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.2)}
function nz(t,dur,vol,dest,hp,lp){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;let n=s;if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;n.connect(f);n=f}if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;n.connect(f);n=f}
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function playStep(tr,step,t,sd){const nb=tr.chords.length,bar=Math.floor(step/8)%nb,s=step%8,ch=tr.chords[bar],D=AU.mus;
 const mi=step%(nb*8),tok=tr.mel[mi];if(tok&&tok!=='.'&&tok!=='-'){let n=1;while(tr.mel[(mi+n)%(nb*8)]==='-'&&n<8)n++;const m=midi(tok);if(m)osc(tr.lead,mf(m),t,n*sd*.92,.11,D,{vib:1})}
 const bt=tr.bassP[s];if(bt&&bt!=='.'){const r=36+ch.root+(ch.root>6?-12:0)+12;const m=bt==='o'?r+12:bt==='f'?r+7:r;if(tr.saw)sawBass(mf(m),t,sd*.85,.11);else osc('triangle',mf(m),t,sd*.85,.26,D,{sus:.8})}
 if(tr.arp){for(let k=0;k<2;k++){const idx=(s*2+k)%ch.t.length;const m=60+ch.root+(ch.root>6?-12:0)+ch.t[idx]+(tr.dark?0:12)*(((s>>2)&1));osc('triangle',mf(m),t+k*sd/2,sd/2*.9,.06,D,{sus:.15})}}
 if(tr.pad&&s===0){for(const iv of ch.t.slice(0,3)){const m=48+ch.root+iv+(ch.root>6?-12:0)+12;padNote(mf(m),t,sd*8*.98,.035)}}
 const dt=tr.drumP[s];if(dt){if(dt==='k'||dt==='K'){osc('sine',150,t,.12,.5,D,{to:45,sus:.3})}if(dt==='s'||dt==='S'){nz(t,.13,.22,D,1200);osc('triangle',220,t,.06,.12,D,{to:120})}
  if(dt==='h'||dt==='K'||dt==='S')nz(t,.03,.07,D,7000);if(dt==='o')nz(t,.18,.08,D,6000)}}
function padNote(f,t,dur,vol){const c=AU.ctx,g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(1600,t+dur*.5);lp.frequency.linearRampToValueAtTime(800,t+dur);
 for(const det of [-7,7]){const s=c.createOscillator();s.type='sawtooth';s.frequency.value=f;s.detune.value=det;s.connect(lp);s.start(t);s.stop(t+dur+.3)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.25);g.gain.setTargetAtTime(0,t+dur-.1,.15);lp.connect(g);g.connect(AU.mus)}
function sawBass(f,t,dur,vol){const c=AU.ctx,s=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();s.type='sawtooth';s.frequency.value=f;lp.type='lowpass';lp.Q.value=6;lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(220,t+dur);

let sfxGate={};
function arpU(fs,t,step,type,vol,D){fs.forEach((f,i)=>osc(type,f,t+i*step,step*1.4,vol,D))}
function bp(t,dur,vol,f,q){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q||1.2;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(b);b.connect(g);g.connect(AU.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function crumple(t,n,vol){for(let i=0;i<n;i++)bp(t+i*.028+Math.random()*.02,.04+Math.random()*.04,vol*(0.6+Math.random()*.5),1500+Math.random()*3500,2)}
function sfx(name,v){const c=AU.ctx;if(!c||c.state!=='running')return;const t=c.currentTime,D=AU.sfx;const now=performance.now();if(sfxGate[name]&&now-sfxGate[name]<(name==='fold'?60:35))return;sfxGate[name]=now;v=v||0;
 switch(name){
 case'click':bp(t,.04,.25,2600,3);osc('triangle',880,t,.05,.12,D);break;
 case'back':bp(t,.04,.2,1800,3);osc('triangle',587,t,.06,.1,D);break;
 case'open':crumple(t,3,.18);osc('triangle',660,t+.02,.06,.1,D);osc('triangle',990,t+.07,.08,.1,D);break;
 case'build':crumple(t,5,.25);osc('sine',140,t+.12,.14,.4,D,{to:60});arpU([523,659,784],t+.16,.05,'triangle',.12,D);break;
 case'upgrade':crumple(t,3,.2);arpU([523,659,784,1047,1319],t+.05,.05,'p25',.1,D);break;
 case'sell':arpU([1319,1047,784],t,.05,'p25',.1,D);bp(t,.15,.15,5000,1);break;
 case'dart':bp(t,.09,.12,3200,1.5);osc('sine',900,t,.06,.03,D,{to:1500});break;

function mkPath(pts){const seg=[];let L=0;for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],l=Math.hypot(x1-x0,y1-y0);seg.push({x0,y0,x1,y1,l,s:L});L+=l}

function segDist(px,py,s){const vx=s.x1-s.x0,vy=s.y1-s.y0,l2=vx*vx+vy*vy;let k=l2?((px-s.x0)*vx+(py-s.y0)*vy)/l2:0;k=Math.max(0,Math.min(1,k));return Math.hypot(px-(s.x0+vx*k),py-(s.y0+vy*k))}
function pathDist(px,py,paths){let m=1e9;for(const p of paths)for(const s of p.seg)m=Math.min(m,segDist(px,py,s));return m}
function nearestOnPath(px,py,paths){let best=null;for(const p of paths)for(const s of p.seg){const vx=s.x1-s.x0,vy=s.y1-s.y0,l2=vx*vx+vy*vy;let k=l2?((px-s.x0)*vx+(py-s.y0)*vy)/l2:0;k=Math.max(0,Math.min(1,k));const x=s.x0+vx*k,y=s.y0+vy*k,dd=Math.hypot(px-x,py-y);if(!best||dd<best.dist)best={p,d:s.s+s.l*k,x,y,dist:dd}}return best}

function botThink(S,unl){if(S.result)return;if(S.phase==='ready')startWave(S);

  const needAir=S.cfg.pool.includes('kite')||(S.cfg.boss||[]).includes('dragon');const aa=S.towers.filter(t=>t.type==='plane'||t.type==='crane'||t.type==='fan').length;if(needAir&&aa<Math.ceil((k+1)/3))type=unl.includes('crane')&&k>4?'crane':'plane';
  if(S.gold>=towerCost(S,type,0))build(S,free[0],type)}
 else{let best=null;for(const t of S.towers)if(t.lvl<2&&(!best||t.lvl<best.lvl||(t.lvl===best.lvl&&t.pad.cov>best.pad.cov)))best=t;if(best&&S.gold>=towerCost(S,best.type,best.lvl+1))upgrade(S,best)}

async function rewardedReady(){if(!runHost())return false;try{return !!(await withTimeout(window.PaperAds.isRewardedReady(),4000))}catch(e){return false}}
async function adRewarded(id,name){if(!runHost()){toast('ADS ONLY RUN ON RUN.WORLD - BONUS SKIPPED');return false}if(adBusy)return false;adBusy=true;AU.duck=0;applyVolumes();
 try{const ok=await withTimeout(window.PaperAds.showRewarded({adDisplayId:id,adDisplayName:name}),45000);if(!ok)toast('NO AD RIGHT NOW - TRY AGAIN LATER');track('ad_rewarded',{id,ok:!!ok});return !!ok}catch(e){return false}finally{adBusy=false;AU.duck=1;applyVolumes();last=performance.now()}}
/* capped interstitial: at most every 2nd break, >=90s apart, never in the first 60s of a session. A failed or timed-out ad still counts toward the cap. */

 try{const ok=await withTimeout(window.PaperAds.showInterstitial({adDisplayId:'siege_break',adDisplayName:'Siege Break'}),20000);track('ad_interstitial',{ok:!!ok});return !!ok}catch(e){return false}finally{lastAdAt=Date.now();breaksSinceAd=0;adBusy=false;AU.duck=1;applyVolumes();last=performance.now()}}

function startGame(mode,li,treasury){S=newGame(mode,li,SAVE.up);S.speed=SAVE.set.fast?2:1;if(treasury){S.gold+=100;S.treasury=1}paused=false;notice=null;hint=null;resultInfo=null;bgFor=null;EV=[];

 track('level_start',{mode,li});

 else if(mode==='camp'&&li===1)showHint('New power: PAPER WALL. Tap it, then tap the road to hold the army back for 6 seconds.','t_wall',8);

 else if(S.mode==='endless'){const w=Math.max(0,S.wave-1);if(w>SAVE.endBest){SAVE.endBest=w;first=true}seals=Math.floor(w/2)}
 else{const w=r==='win'?S.nWaves:Math.max(0,S.wave-1);if(w>SAVE.daily.best)SAVE.daily.best=w;if(r==='win'&&!SAVE.daily.won){SAVE.daily.won=1;seals=15;first=true}else seals=Math.floor(w/3)}

function step(dt){T+=dt;sessionT+=dt;if(toastT>0)toastT-=dt;if(resetArm>0)resetArm-=dt;if(hint){hint.t+=dt;if(hint.t>hint.dur)hint=null}
 if(scene==='play'&&S&&!paused&&!notice&&!adBusy){const sp=S.speed||1;let left=dt*sp;while(left>0){const h=Math.min(left,1/60);update(S,h);left-=h;if(S.result)break}handleEvents();checkNotice();if(S.result)finish()}
 if(scene==='result')resultT+=dt}
function frame(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;step(dt);render();requestAnimationFrame(frame)}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#4a3a28';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(K,0,0,K,OX*DPR,OY*DPR);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();BTN=[];
 ({title:drawTitle,map:drawMap,intro:drawIntro,play:drawPlay,result:drawResult,shop:drawShop,records:drawRecords,settings:drawSettings,howto:drawHow,credits:drawCredits}[scene]||drawTitle)();
 if(scene!=='play'&&toastT>0)drawToast();if(focus>=BTN.length)focus=-1;ctx.restore()}
resize();requestAnimationFrame(frame);
/* ---------- test hooks (headless QA) ---------- */
window.PKS={go,get scene(){return scene},get S(){return S},get SAVE(){return SAVE},startGame,openIntro,finish,
 sim(sec,bot){const unl=unlockedTowers(S).concat(wallUnlocked(S)?['wall']:[]);let bt=0;for(let t=0;t<sec&&!S.result;t+=1/30){update(S,1/30);bt+=1/30;if(bot&&bt>=.5){bt=0;botThink(S,unl)}}EV=[];if(S.result&&scene==='play')finish();return{result:S.result,wave:S.wave,hearts:S.hearts,gold:S.gold,towers:S.towers.length}},
 tapPad(i){const p=S.pads[i];fieldTap(p.x,p.y)},tap(x,y){fieldTap(x,y)},clickBtn(id){const b=BTN.find(b=>b.id===id);if(b&&!b.dis){b.fn();return true}return false},btns(){return BTN.map(b=>b.id)},setPaused(v){paused=v},dismiss(){notice=null;hint=null},get notice(){return notice}};
