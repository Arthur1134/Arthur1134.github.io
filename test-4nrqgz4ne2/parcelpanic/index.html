<script>

/* ===== Parcel Panic v0.2.0 — neon depot facelift, dual-axis controls, ordered elevators ===== */
const VERSION='0.2.2',W=360,H=640,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const COLS=['#ff4f8b','#ffd23f','#3bf0a0','#b57bff','#4fc3ff'],CNAME={'#ff4f8b':'PINK','#ffd23f':'GOLD','#3bf0a0':'MINT','#b57bff':'GRAPE','#4fc3ff':'SKY'};
const HUD_H=52,BELT_Y=H-44,SHAFT_W=78;
let state='title',keys={},best=+localStorage.ppBest||0,runs=0,revived=false,muted=localStorage.ppMute==='1',paused=false;
let P,pkgs,cars,pigeons,lines,parts=[],rings=[],floats=[],score,time,combo,comboT,wind,windTarget,gust,spawnT,beltT,t=0,pt=0,shake=0,flash=0,flashC='#fff',freeze=0,delivered=0,lastTick=0,comboPop=0,clocks=[],clockT=0,pkgN=0;
const R=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u;

/* ---------- Audio (tiny WebAudio synth) ---------- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d=.1,type='square',vol=.08,f2=null,delay=0){if(muted||!AC)return;const o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
 v.gain.setValueAtTime(vol,s);v.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d+.02)}
function noise(d=.25,vol=.06,hp=800){if(muted||!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=hp;v.gain.value=vol;s.connect(f);f.connect(v);v.connect(AC.destination);s.start()}
/* ---------- Music: procedural neon-depot synthwave loop (96 BPM, original) ---------- */
const Music={bpm:96,step:0,next:0,on:false,bus:null,
 // A minor groove: Am - F - C - G (one bar each, 16 sixteenths)
 roots:[110,87.31,130.81,98],chords:[[0,3,7,12],[0,4,7,12],[0,4,7,11],[0,4,7,10]],
 lead:[0,null,7,null,12,null,10,7,null,3,null,7,5,null,3,null],
 ensure(){if(!AC)return false;if(!this.bus){this.bus=AC.createGain();this.bus.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;this.bus.connect(lp);lp.connect(AC.destination)}return true},
 n(f,s,d,type,vol,cut){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,s);
  v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(vol,s+.01);v.gain.exponentialRampToValueAtTime(.0001,s+d);
  if(cut){const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.setValueAtTime(cut,s);f2.frequency.exponentialRampToValueAtTime(cut*.35,s+d);o.connect(f2);f2.connect(v)}else o.connect(v);
  v.connect(this.bus);o.start(s);o.stop(s+d+.03)},
 hat(s,vol){const len=.04,b=AC.createBuffer(1,AC.sampleRate*len|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*(1-i/a.length);
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();src.buffer=b;f.type='highpass';f.frequency.value=7000;v.gain.value=vol;src.connect(f);f.connect(v);v.connect(this.bus);src.start(s)},
 kick(s){const o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(42,s+.18);v.gain.setValueAtTime(.9,s);v.gain.exponentialRampToValueAtTime(.001,s+.22);o.connect(v);v.connect(this.bus);o.start(s);o.stop(s+.25)},
 play(i,s){const bar=(i>>4)%4,st=i%16,root=this.roots[bar],sx=60/this.bpm/4,ch=this.chords[bar];
  if(st%4===0)this.kick(s);
  if(st%2===1)this.hat(s,st%4===3?.35:.18);
  if(st===4||st===12)this.hat(s,.5);
  if(st%2===0)this.n(root*(st%4===2?2:1),s,sx*1.8,'sawtooth',.5,900);           // bass 8ths w/ octave bounce
  this.n(root*4*Math.pow(2,ch[st%4]/12),s,sx*.9,'square',.12,2400);             // arp shimmer
  if(st===0)ch.slice(0,3).forEach(c=>this.n(root*2*Math.pow(2,c/12),s,sx*15,'triangle',.12)); // pad
  const L=this.lead[st];if(L!==null&&(i>>6)%2===1)this.n(root*4*Math.pow(2,L/12),s,sx*1.6,'triangle',.32)}, // lead on alternate 4-bar phrases
 update(){const want=state==='play'&&!paused&&!muted;if(!this.ensure())return;const now=AC.currentTime,g=this.bus.gain;
  if(want!==this.on){this.on=want;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(want?.05:0,now+(want?1.2:.35));if(want)this.next=now+.06}
  if(state!=='play')this.step=0;
  if(!this.on)return;const sx=60/this.bpm/4;if(this.next<now)this.next=now+.02;
  while(this.next<now+.2){this.play(this.step,this.next);this.step++;this.next+=sx}},
 start(){this.step=0;this.update()},stop(){state!=='play'&&this.update()}};
const SFX={
 pickup(){tone(520,.09,'square',.07,880)},
 deliver(c){const b=[523,659,784,1047];b.forEach((f,i)=>tone(f*(1+Math.min(c,6)*.06),.12,'square',.06,null,i*.05))},
 perfect(){[784,988,1175,1568].forEach((f,i)=>tone(f,.14,'triangle',.08,null,i*.045))},
 wrong(){tone(180,.18,'sawtooth',.06,120)},
 hit(){tone(300,.25,'sawtooth',.09,60);noise(.2,.08,500)},
 tick(){tone(1400,.03,'square',.04)},
 gust(){noise(.6,.05,1200)},
 clock(){[988,1319,1760].forEach((f,i)=>tone(f,.12,'sine',.07,null,i*.06))},
 timepkg(){[659,988,1319,1976].forEach((f,i)=>tone(f,.12,'triangle',.07,null,i*.05))},
 combo(){tone(1568,.08,'square',.04,2093)},
 ding(){tone(1320,.08,'sine',.03)},
 start(){[392,523,659,784].forEach((f,i)=>tone(f,.1,'square',.06,null,i*.07))},
 over(){[523,392,330,262].forEach((f,i)=>tone(f,.18,'triangle',.08,null,i*.12))}
};

/* ---------- Ordered elevator system ----------
 Each side has 2 shafts' worth of cars; every car owns a fixed FLOOR BAND it patrols.
 Same-side bands never overlap (gap between them), and left/right are half-cycle offset,
 so cars move like elevators: travel, stop (doors), travel back — never piling up. */
const FLOORS=[ // lo/hi = car-floor Y range (the deck line). Gaps keep target zones separate.
 {side:0,lo:150,hi:300,name:'A'},{side:1,lo:150,hi:300,name:'B'},
 {side:0,lo:370,hi:520,name:'C'},{side:1,lo:370,hi:520,name:'D'}];
const PERIOD=7.2; // seconds per full elevator round trip
function carEase(u){ // hold at bottom, glide up, hold at top, glide down (smooth)
 const hold=.18,mv=.32,s=x=>x*x*(3-2*x);
 if(u<hold)return 0;if(u<hold+mv)return s((u-hold)/mv);if(u<hold*2+mv)return 1;return 1-s((u-hold*2-mv)/mv)}
function mkCars(){const cs=COLS.slice().sort(()=>R()-.5);return FLOORS.map((f,i)=>({i,f,side:f.side,x:f.side?W-SHAFT_W/2:SHAFT_W/2,y:f.hi,
  off:(f.side?.5:0)+(i>1?.25:0),col:cs[i],swapT:0,newCol:null,glow:0,deny:0,stopped:false}))}
function freeColor(){const used=cars.map(c=>c.newCol||c.col);const f=COLS.filter(c=>!used.includes(c));return f[(R()*f.length)|0]}
function liveColors(){return cars.filter(c=>!c.swapT).map(c=>c.col)}

function reset(){P={x:W/2,y:H/2,vx:0,vy:0,carry:null,tilt:0,inv:0};pkgs=[];pigeons=[];parts=[];rings=[];floats=[];cars=mkCars();
 score=0;time=60;combo=0;comboT=0;wind=0;windTarget=0;gust={warn:0,t:5,dir:0};spawnT=6;beltT=0;pt=0;delivered=0;revived=false;flash=0;freeze=0;clocks=[];clockT=6+R()*4;pkgN=0;
 // v0.2.1: shorter lines anchored to alternate walls → ~112px open gap on each, and moved away from the belt
 lines=[{y:250,ph:0,cd:0,a:0,b:.45},{y:445,ph:2,cd:0,a:.55,b:1}];
 for(let i=0;i<3;i++)pkgs.push(mkPkg(90+i*90))}
function mkPkg(x){const lc=liveColors();pkgN++;const tp=x==null&&pkgN>5&&R()<.15&&!pkgs.some(k=>k.time);return{x:x??(SHAFT_W+16),y:BELT_Y-12,col:lc[(R()*lc.length)|0],bob:R()*6,pop:1,time:tp}}

/* ---------- Input: LEFT = vertical only, RIGHT = horizontal only ---------- */
const stick={v:0,h:0},touchSt={L:null,R:null};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();audio();keys[k]=1;
 if([' ','enter','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(k===' '||k==='enter')press();if(k==='m'){muted=!muted;localStorage.ppMute=muted?'1':'0'}if((k==='p'||k==='escape')&&state==='play')paused=!paused;if(k==='q'&&paused&&state==='play')quitToTitle()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{keys={};if(state==='play')paused=true});
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{audio();const p=pos(e);
 if(state!=='play'){press(p);return}
 if(paused){for(const b of pbtns)if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h){b.f();return}return}
 if(p.y<HUD_H&&p.x>W-50){paused=true;return}
 const side=p.x<W/2?'L':'R';touchSt[side]={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{for(const s of['L','R']){const T=touchSt[s];if(T&&T.id===e.pointerId){const p=pos(e);T.x=p.x;T.y=p.y}}});
function up(e){for(const s of['L','R'])if(touchSt[s]&&touchSt[s].id===e.pointerId)touchSt[s]=null}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function readInput(){let v=0,h=0;
 // keyboard: LEFT hand W/S = up/down · RIGHT hand ←/→ = left/right (↑/↓ and A/D also work as aliases)
 if(keys.w||keys.arrowup)v-=1;if(keys.s||keys.arrowdown)v+=1;
 if(keys.arrowleft||keys.a)h-=1;if(keys.arrowright||keys.d)h+=1;
 if(touchSt.L)v=clamp((touchSt.L.y-touchSt.L.oy)/34,-1,1);
 if(touchSt.R)h=clamp((touchSt.R.x-touchSt.R.ox)/34,-1,1);
 const gp=navigator.getGamepads?[...navigator.getGamepads()].find(p=>p):null;
 if(gp){const dz=x=>Math.abs(x)<.18?0:x,ly=dz(gp.axes[1]||0),rx=dz(gp.axes[2]||0);if(ly)v=ly;if(rx)h=rx;
  const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;if(b(12))v=-1;if(b(13))v=1;if(b(14))h=-1;if(b(15))h=1;
  if(b(0)||b(9)){if(!gp._held){gp._held=1;if(state==='play'&&!paused&&b(9))paused=true;else press()}}else gp._held=0;
  if(b(1)||b(8)){if(!gp._q){gp._q=1;if(state==='play'&&paused)quitToTitle()}}else gp._q=0;padHeld=b(0)||b(9)}
 stick.v=v;stick.h=h}
let padHeld=0,btns=[],pbtns=[];
function quitToTitle(){paused=false;state='title';keys={};touchSt.L=touchSt.R=null;SFX.over()}
function press(p){audio();
 if(state==='title'){reset();state='play';SFX.start();return}
 if(state==='play'&&paused){paused=false;return}
 if(state==='over'){if(t-overAt<40)return;
  if(p){for(const b of btns)if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h){b.f();return}return}
  restart()}}
let overAt=0;
async function restart(){runs++;if(runs%2===0)await RunAds.showInterstitial();reset();state='play';SFX.start()}
async function revive(){if(revived)return;const ok=await RunAds.showRewarded();if(ok){const s=score,d=delivered;reset();score=s;delivered=d;time=15;revived=true;state='play';SFX.start()}}
function gameOver(){state='over';overAt=t;SFX.over();if(score>best){best=score;localStorage.ppBest=best;floats.push({x:W/2,y:200,s:'NEW BEST!',l:9999,big:1})}}

/* ---------- FX helpers ---------- */
function boom(x,y,c,n=12,sp=6){for(let i=0;i<n;i++){const a=R()*7,s=R()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:30+R()*15,c,sq:R()<.5})}rings.push({x,y,r:4,l:24,c})}
function floatTxt(x,y,s,c='#fff',sz=16){floats.push({x,y,s,l:60,c,sz})}

/* ---------- Update ---------- */
function update(){t++;readInput();Music.update();
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(!p.tr)p.vy+=.12;p.l--}parts=parts.filter(p=>p.l>0);
 for(const r of rings){r.r+=2.4;r.l--}rings=rings.filter(r=>r.l>0);
 for(const f of floats){f.y-=f.big?0:.7;f.l--}floats=floats.filter(f=>f.l>0);
 if(shake>0)shake*=.85;if(shake<.3)shake=0;if(flash>0)flash--;if(comboPop>0)comboPop--;
 if(state!=='play'||paused)return;
 if(freeze>0){freeze--;return}
 pt++;const dt=1/60;time-=dt;
 if(time<=5.5&&Math.ceil(time)!==lastTick){lastTick=Math.ceil(time);SFX.tick()}
 if(time<=0){time=0;gameOver();return}
 // wind: telegraphed gusts (1.5s warning) — none in first 10s
 gust.t-=dt;
 if(gust.warn>0){gust.warn-=dt;if(gust.warn<=0){windTarget=gust.dir*(.22+Math.min(.18,pt/60/300));SFX.gust();gust.t=2.2+R()*1.2}}
 else if(gust.t<=0){if(windTarget){windTarget=0;gust.t=3+R()*3}else if(pt>600){gust.dir=R()<.5?-1:1;gust.warn=1.5;gust.t=99}else gust.t=1}
 wind=lerp(wind,windTarget,.04);
 if(Math.abs(wind)>.05&&t%3===0)parts.push({x:wind>0?-5:W+5,y:HUD_H+R()*(H-HUD_H-60),vx:wind*28,vy:0,l:28,c:'rgba(200,240,255,.6)',tr:2});
 // drone physics — vertical & horizontal fully independent axes
 P.vx=(P.vx+stick.h*.6+wind)*.88;P.vy=(P.vy+stick.v*.6+.04)*.88;P.x+=P.vx;P.y+=P.vy;
 P.x=clamp(P.x,16,W-16);P.y=clamp(P.y,HUD_H+18,BELT_Y-6);P.tilt=lerp(P.tilt,clamp(P.vx*.07,-.4,.4),.2);if(P.inv>0)P.inv--;
 comboT-=dt;if(comboT<=0&&combo){combo=0}
 // conveyor belt parcels
 beltT-=dt;for(const k of pkgs){k.x+=.35;if(k.pop>0)k.pop-=.05}
 pkgs=pkgs.filter(k=>k.x<W-SHAFT_W-14);
 if(pkgs.length<3&&beltT<=0){pkgs.push(mkPkg());beltT=1.2}
 // v0.2.2 TIME parcels: instant +8s on touch, never occupy the carry slot
 for(let i=0;i<pkgs.length;i++){const k=pkgs[i];if(k.time&&Math.hypot(k.x-P.x,k.y-P.y)<24){pkgs.splice(i,1);gainTime(8,k.x,k.y-24,'TIME +8s');score+=50;boom(k.x,k.y,'#ffd23f',18,5);SFX.timepkg();break}}
 // v0.2.2 clock pickups in the air lanes (+5s)
 clockT-=dt;if(clockT<=0){clockT=8+R()*6;if(clocks.length<2)clocks.push({x:SHAFT_W+34+R()*(W-SHAFT_W*2-68),y:HUD_H+60+R()*(BELT_Y-HUD_H-130),l:420,ph:R()*6})}
 for(const c of clocks){c.l--;c.ph+=.06;if(Math.hypot(c.x-P.x,c.y+Math.sin(c.ph)*4-P.y)<22){c.l=0;c.got=1;gainTime(5,c.x,c.y-20,'+5s');boom(c.x,c.y,'#5ff3ff',16,4);SFX.clock()}}
 clocks=clocks.filter(c=>c.l>0);
 if(!P.carry)for(let i=0;i<pkgs.length;i++){const k=pkgs[i];if(!k.time&&Math.hypot(k.x-P.x,k.y-P.y)<24){P.carry=k.col;pkgs.splice(i,1);boom(k.x,k.y,k.col,10,4);SFX.pickup();floatTxt(k.x,k.y-24,CNAME[k.col]+'!',k.col,13);break}}
 // elevators
 const cyc=pt/60/PERIOD;
 for(const c of cars){const u=((cyc+c.off)%1+1)%1,e=carEase(u),ny=lerp(c.f.hi,c.f.lo,e);const st=Math.abs(ny-c.y)<.01;
  c.stopped=st;c.y=ny;if(c.glow>0)c.glow--;if(c.deny>0)c.deny--;
  if(c.swapT>0){c.swapT--;if(!c.swapT){const old=c.col;c.col=c.newCol;c.newCol=null;for(const k of pkgs)if(k.col===old){k.col=c.col;k.pop=1}boom(c.x,c.y-30,c.col,8,3)}continue}
  const zx=Math.abs(P.x-c.x)<42,zy=Math.abs(P.y-(c.y-26))<26;
  if(P.carry&&zx&&zy){
   if(P.carry===c.col){const perfect=Math.abs(P.x-c.x)<14&&Math.abs(P.y-(c.y-26))<12;
    combo++;comboT=4.5;comboPop=18;delivered++;let pts=100*combo;if(perfect)pts+=150;score+=pts;time+=perfect?4:3;if(combo%3===0){time+=2;floatTxt(W/2,H/2-10,'COMBO TIME +2s','#3bf0a0',16);SFX.combo()}
    boom(c.x,c.y-26,c.col,perfect?34:22);c.glow=40;freeze=perfect?6:3;flash=perfect?10:5;flashC=c.col;shake=perfect?6:3;
    floatTxt(c.x+(c.side?-30:30),c.y-60,'+'+pts,c.col,18);if(combo>1)floatTxt(c.x+(c.side?-30:30),c.y-80,'COMBO x'+combo,'#fff',14);
    if(perfect){floatTxt(W/2,H/2-40,'PERFECT DROP!','#fff',22);SFX.perfect()}else SFX.deliver(combo);
    P.carry=null;c.swapT=50;c.newCol=freeColor()}
   else if(!c.deny){c.deny=45;SFX.wrong();floatTxt(c.x+(c.side?-36:36),c.y-56,'WRONG COLOR','#ff6b6b',12);P.vx+=c.side?-3:3}}}
 // pigeons (grace period first 6s, gentle ramp)
