const W=360,H=640,FL=60,FR=300,SLOT_Y=[112,178,244,310,376],SLOT_H=58,BAND_T=240,BAND_B=306;

function seg(a,ax,ay,bx,by,o){a.push({ax,ay,bx,by,e:o&&o.e!=null?o.e:0.5,kind:o&&o.kind||'wall'})}
function arcSegs(a,cx,cy,r,a0,a1,n){let px=cx+Math.cos(a0)*r,py=cy+Math.sin(a0)*r;for(let i=1;i<=n;i++){const t=a0+(a1-a0)*i/n,x=cx+Math.cos(t)*r,y=cy+Math.sin(t)*r;seg(a,px,py,x,y);px=x;py=y}}
function buildGeo(idx){
 if(GEOS[idx])return GEOS[idx];
 const d=ROUTES[idx],cross=!!d.cars,walls=[],houses=[];
 // top
 arcSegs(walls,108,108,48,Math.PI,Math.PI*1.5,6);
 if(d.top!=='-'){seg(walls,108,60,150,60);seg(walls,150,60,150,100);seg(walls,150,100,210,100);seg(walls,210,100,210,60);seg(walls,210,60,252,60);
  houses.push({side:'T',x:150,y:60,w:60,h:40,sub:d.top==='S',porch:{x:168,y:100,w:24,h:15},col:0});}
 else seg(walls,108,60,252,60);
 arcSegs(walls,252,108,48,Math.PI*1.5,Math.PI*2,6);
 for(const side of ['L','R']){const X=side==='L'?FL:FR,O=side==='L'?8:352;
  if(cross){seg(walls,X,108,X,BAND_T);seg(walls,X,BAND_T,O,BAND_T);seg(walls,O,BAND_T,O,BAND_B);seg(walls,O,BAND_B,X,BAND_B);seg(walls,X,BAND_B,X,470)}
  else seg(walls,X,108,X,470);
  const str=d[side];for(let i=0;i<5;i++){const ch=str[i];if(ch==='-')continue;const y=SLOT_Y[i],cy=y+SLOT_H/2;
   houses.push({side,slot:i,x:side==='L'?8:FR,y,w:52,h:SLOT_H,sub:ch==='S',porch:{x:side==='L'?FL:FR-PORCH_W,y:cy-PORCH_H/2,w:PORCH_W,h:PORCH_H},col:(i*2+(side==='R'?3:0)+idx)%6})}}
 // inlane guides to flippers
 seg(walls,FL,470,FL,482);seg(walls,FL,482,118,542,{e:.35,kind:'guide'});
 seg(walls,FR,470,FR,482);seg(walls,FR,482,242,542,{e:.35,kind:'guide'});
 const bumpers=(d.bump||[]).map(b=>({x:b[0],y:b[1],r:BUMP_R[b[2]]||11,type:b[2]}));
 const mail=(d.mail||[]).map(m=>({x:m[0],y:m[1],r:7}));
 const ramps=(d.ramps||[]).map(r=>({x:r[0],y:r[1],ang:r[2]*Math.PI/180,len:34,w:24}));
 const spr=(d.spr||[]).map(s=>({x:s[0],y:s[1],mid:s[2]*Math.PI/180,sw:s[3]*Math.PI/360,spd:s[4],rad:50}));
 const pud=(d.pud||[]).map(p=>({x:p[0],y:p[1],r:p[2]}));
 // pickup spots: grid of street points not overlapping anything
 const spots=[];for(let y=140;y<=450;y+=26)for(let x=96;x<=264;x+=28){if(cross&&y>BAND_T-10&&y<BAND_B+10)continue;
  let ok=true;for(const o of [...bumpers,...mail,...pud])if(Math.hypot(o.x-x,o.y-y)<o.r+22)ok=false;for(const r of ramps)if(Math.hypot(r.x-x,r.y-y)<32)ok=false;for(const s of spr)if(Math.hypot(s.x-x,s.y-y)<26)ok=false;if(ok)spots.push([x,y])}
 const g={idx,def:d,area:d.a,cross,walls,houses,bumpers,mail,ramps,spr,pud,spots,need:houses.filter(h=>h.sub).length};
 GEOS[idx]=g;return g}
function rnd(S){let t=(S.seed=(S.seed+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
function newState(idx,seed){const G=buildGeo(idx),d=G.def;
 const S={idx,seed:seed>>>0||12345,t:0,score:0,papers:d.papers,mult:1,combo:0,bestCombo:0,bestMult:1,delivered:0,need:G.need,lost:0,thrown:0,wrong:0,
  mode:'aim',aim:0,power:.62,ball:null,readyT:0,over:false,complete:false,bundle:false,cont:false,skill:0,

  hs:G.houses.map(()=>({done:false,fl:0,wr:0})),bs:G.bumpers.map(()=>({fl:0,cd:0})),ms:G.mail.map(()=>({up:false,fl:0})),mailReset:0,

  cars:[],carT:1.2,lane:0,pk:[],pickT:(d.pick||0)*0.6,magnet:0,gold:false,wind:0,gust:0,gustT:3,gustTarget:0,flash:0,
  st:{bump:0,mail:0,ramp:0,dog:0,pick:0,car:0,splash:0},ev:[]};
 return S}
function cloneState(S){const C=JSON.parse(JSON.stringify(S));C.ev=[];C.sim=true;return C}
function emit(S,type,x,y,v){if(!S.sim)S.ev.push({type,x,y,v})}
function addScore(S,pts,x,y,label){const p=Math.round(pts*S.mult);S.score+=p;emit(S,'pts',x,y,{p,label});return p}
function launch(S,ang,pw){if(S.mode!=='aim'||S.papers<=0||S.complete||S.over)return false;ang=Math.max(-1.05,Math.min(1.05,ang));pw=Math.max(0,Math.min(1,pw));
 S.papers--;S.thrown++;const v=360+pw*560;S.ball={x:LAUNCH_X,y:LAUNCH_Y,vx:Math.sin(ang)*v,vy:-Math.cos(ang)*v,air:0,sog:0,launching:1,flip:0,stuck:0,spin:0,age:0,trail:[]};
 S.mode='play';S.combo=0;S.aim=ang;S.power=pw;emit(S,'launch',LAUNCH_X,LAUNCH_Y);return true}
function windOf(S){return S.wind}
function updFlip(f,h){const tgt=f.on?f.up:f.rest,max=f.on?30:18;let w=(tgt-f.a)/h;if(w>max)w=max;if(w<-max)w=-max;f.a+=w*h;f.w=w}
function step(S,dt,inp){
 const G=GEOS[S.idx],d=G.def;S.t+=dt;
 const l=!!(inp&&inp.l),r=!!(inp&&inp.r);
 if(l&&!S.fl[0].on)emit(S,'flip',118,548);if(r&&!S.fl[1].on)emit(S,'flip',242,548);S.fl[0].on=l;S.fl[1].on=r;
 // wind
 if(d.wind){S.gustT-=dt;if(S.gustT<=0){S.gustT=3.5+rnd(S)*5;S.gustTarget=(rnd(S)*2-1)*d.wind.gust;if(Math.abs(S.gustTarget)>30)emit(S,'gust',180,300,S.gustTarget)}
  S.gustTarget*=1-.35*dt;S.gust+=(S.gustTarget-S.gust)*Math.min(1,2.5*dt);S.wind=d.wind.base+d.wind.amp*Math.sin(S.t*.33+S.idx)+S.gust}
 // hazards
 for(const dg of S.dogs){const len=Math.hypot(dg.x2-dg.x1,dg.y2-dg.y1)||1;dg.u+=dg.dir*dg.spd*dt/len;if(dg.u>1){dg.u=1;dg.dir=-1}if(dg.u<0){dg.u=0;dg.dir=1}
  const px=dg.x1+(dg.x2-dg.x1)*dg.u,py=dg.y1+(dg.y2-dg.y1)*dg.u;let tx=0,ty=0;const b=S.ball;dg.bcd-=dt;

 const prevBest=SAVE.best[S.idx]||0;tally={b,total,stars,newBest:total>prevBest,t:0,shown:0,allDone:S.idx===ROUTES.length-1};
 SAVE.best[S.idx]=Math.max(prevBest,total);SAVE.stars[S.idx]=Math.max(SAVE.stars[S.idx]||0,stars);SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(ROUTES.length,S.idx+2));
 addStats();st.routes++;addTop(total,S.idx,true);persist();track('route_complete',{route:S.idx,score:total,stars});go('complete')}

 st.bestCombo=Math.max(st.bestCombo,S.bestCombo);st.bestMult=Math.max(st.bestMult,S.bestMult);S.thrown=0;S.delivered=0;S.st={bump:0,mail:0,ramp:0,dog:0,pick:0,car:0,splash:0};S.wrong=0;S.skill=0;S._statsDel=(S._statsDel||0)}

const STEP=1/120;
function update(dt){T+=dt;sessionT+=dt;if(toastT>0)toastT-=dt;shakeA*=Math.pow(.02,dt);if(shakeA<.1)shakeA=0;if(throwT>0)throwT=Math.max(0,throwT-dt*3);
 for(const p of P){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-2*dt;p.vy=p.vy*(1-2*dt)+(p.k==='conf'?160:p.k==='leaf'?10:60)*dt;p.r+=dt*8}P=P.filter(p=>p.life>0);
 for(const u of PU)u.t+=dt;PU=PU.filter(u=>u.t<u.life);for(const b of BN)b.t+=dt;BN=BN.filter(b=>b.t<b.life);
 idleT+=dt;if(scene==='title'&&started&&idleT>18){S=newState(Math.floor(Math.random()*Math.min(ROUTES.length,Math.max(3,SAVE.unlocked))),Date.now()&0xffff);ensureBg(S.idx);P=[];PU=[];go('attract')}
 if(scene==='attract'){acc+=dt;let n=0;while(acc>=STEP&&n<8){if(S.mode==='aim'){const s=botShot(S,.3);launch(S,s[0]+(Math.random()-.5)*.1,s[1])}step(S,STEP,botFlips(S));S.ev=S.ev.filter(e=>['bump','deliver','mail','ramp','pts','dog','drain'].includes(e.type));handleEventsQuiet();acc-=STEP;n++}
  if(S.complete||S.over||idleT>40){go('title')}}
 if(scene==='play'&&S&&!paused&&!adBusy){SAVE.stats.time+=dt;if(hitstop>0){hitstop-=dt}else{acc+=dt;let n=0;const inp=flipInput();while(acc>=STEP&&n<10){
   if(S.mode==='aim'){if(keys['ArrowLeft'])S.aim=Math.max(-1.05,S.aim-1.4*STEP);if(keys['ArrowRight'])S.aim=Math.min(1.05,S.aim+1.4*STEP);if(keys['ArrowUp'])S.power=Math.min(1,S.power+.8*STEP);if(keys['ArrowDown'])S.power=Math.max(0,S.power-.8*STEP)}
   step(S,STEP,inp);acc-=STEP;n++}if(n>=10)acc=0;handleEvents()}
  if(ROUTES[S.idx].storm){nextLight-=dt;if(nextLight<=0){nextLight=6+Math.random()*8;lightning=1;thunderAt=.35+Math.random()*.5}if(thunderAt>0){thunderAt-=dt;if(thunderAt<=0)sfx('thunder')}}
  if(S.complete){endT+=dt;if(endT>1.5)finishRoute()}else if(S.over){endT+=dt;if(endT>1.1)gameOver()}}
 if(lightning>0)lightning=Math.max(0,lightning-dt*2.5);
 if(scene==='complete'&&tally){const pt=tally.t;tally.t+=dt;const marks=[.4,.8,1.2,1.6,2.0];marks.forEach((m,i)=>{if(pt<m&&tally.t>=m)sfx('tick')});for(let i=0;i<tally.stars;i++){const m=2.4+i*.35;if(pt<m&&tally.t>=m){sfx('star',i);burst(110+i*70,300,16,['#ffe066','#fff'],160,.7)}}}
 if(scene==='credits')credY+=dt*22;
 // ambient particles

  if(id==='downtown'&&Math.random()<dt*2)P.push({x:208+Math.random()*6-3,y:446,vx:Math.random()*6-3,vy:-14,life:2.5,max:2.5,col:'rgba(230,235,245,.35)',s:6,k:'steam',r:0})}}
