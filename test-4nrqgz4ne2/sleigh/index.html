function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function maxBag() { return 2 + up.bag; }
function bagCost() { return up.bag >= 4 ? null : [8, 16, 30, 48][up.bag]; }
function magCost() { return up.magnet >= 3 ? null : [10, 22, 38][up.magnet]; }

function speed() {

  return s;
}
function nextLockedSkin() {

function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    best = d.best | 0;
    bestNight = d.bestNight | 0;
    if (d.skin && SKINS.some((s) => s.id === d.skin)) up.skin = d.skin;
    unlocked.clear();
    unlocked.add("classic");
    if (Array.isArray(d.skins)) d.skins.forEach((id) => { if (SKINS.some((s) => s.id === id)) unlocked.add(id); });

}

function metrics() {
  groundY = Math.round(gh * (gh > 340 ? 0.70 : 0.78));
  sleigh.x = Math.round(gw * 0.30);
}
function chooseScale(w, h) {
  let s = Math.round(w / 240);
  s = clamp(s, 2, 5);
  while (s > 2 && h / s < 180) s--;
  return s;
}
function resize() {
  const rect = view.getBoundingClientRect();
  cssW = rect.width || window.innerWidth;
  cssH = rect.height || window.innerHeight;
  if (cssW < 8 || cssH < 8) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = chooseScale(cssW, cssH);
  gw = Math.floor(cssW / scale);
  gh = Math.floor(cssH / scale);
  ox = Math.floor((cssW - gw * scale) / 2);
  oy = Math.floor((cssH - gh * scale) / 2);
  view.width = Math.max(1, Math.floor(cssW * dpr));
  view.height = Math.max(1, Math.floor(cssH * dpr));
  off.width = gw;
  off.height = gh;
  const cs = getComputedStyle(safeEl);
  safeG.top = (parseFloat(cs.paddingTop) || 0) / scale;
  safeG.right = (parseFloat(cs.paddingRight) || 0) / scale;
  safeG.bottom = (parseFloat(cs.paddingBottom) || 0) / scale;
  safeG.left = (parseFloat(cs.paddingLeft) || 0) / scale;
  metrics();
  while (snow.length < 56) snow.push(makeFlake(true));
}
function toGame(e) {
  const r = view.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };

function makeFlake(any) {
  return {
    x: Math.random() * gw, y: any ? Math.random() * gh : -4,

function held(code) { return qaKeys ? qaKeys.has(code) : keys.has(code); }
function pollEdges() {
  edges.clear();
  for (const code of WATCH) {
    const down = held(code);
    if (down && !prevHeld.has(code)) edges.add(code);
    if (down) prevHeld.add(code); else prevHeld.delete(code);
  }
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audio.ctx) {
    const ac = new AC();
    const master = ac.createGain();
    master.gain.value = muted ? 0 : 0.24;
    master.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 0.4);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    audio.ctx = ac; audio.master = master; audio.noise = buf; audio.next = ac.currentTime + 0.05;
  }
  if (audio.ctx.state === "suspended") audio.ctx.resume();
}
function tone(midi, when, dur, type, vol) {
  if (!audio.ctx || muted || !midi) return;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = type;
  const hz = 440 * Math.pow(2, (midi - 69) / 12);
  if (!isFinite(hz) || hz < 20 || hz > 20000) return;
  o.frequency.value = hz;
  g.gain.setValueAtTime(Math.max(0.0001, vol), when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(audio.master);
  o.start(when); o.stop(when + dur + 0.02);
}
function toneHz(hz, when, dur, type, vol) {
  if (!(hz > 0)) return;
  tone(69 + 12 * Math.log2(hz / 440), when, dur, type, vol);
}
function noise(when, dur, vol, freq) {
  if (!audio.ctx || !audio.noise || muted) return;
  const src = audio.ctx.createBufferSource();
  src.buffer = audio.noise;
  const f = audio.ctx.createBiquadFilter();
  f.type = "highpass"; f.frequency.value = freq || 1400;
  const g = audio.ctx.createGain();
  g.gain.setValueAtTime(Math.max(0.0001, vol), when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(f); f.connect(g); g.connect(audio.master);
  src.start(when); src.stop(when + dur + 0.02);
}
function sfx(name) {
  ensureAudio();
  if (!audio.ctx || muted) return;
  const t = audio.ctx.currentTime;
  if (name === "ui") toneHz(700, t, 0.05, "square", 0.04);
  else if (name === "no") toneHz(150, t, 0.08, "square", 0.04);
  else if (name === "drop") toneHz(520, t, 0.07, "square", 0.045);
  else if (name === "score") { toneHz(784, t, 0.08, "square", 0.05); toneHz(988, t + 0.07, 0.1, "square", 0.04); }
  else if (name === "perfect") { toneHz(880, t, 0.07, "square", 0.05); toneHz(1175, t + 0.07, 0.08, "square", 0.045); toneHz(1568, t + 0.14, 0.12, "triangle", 0.04); noise(t, 0.08, 0.03, 1800); }
  else if (name === "hoho") { toneHz(392, t, 0.1, "square", 0.05); toneHz(523, t + 0.1, 0.1, "square", 0.05); toneHz(659, t + 0.2, 0.16, "square", 0.05); }
  else if (name === "miss") { toneHz(220, t, 0.1, "square", 0.05); toneHz(146, t + 0.1, 0.16, "triangle", 0.05); }
  else if (name === "hit") { noise(t, 0.18, 0.08, 400); toneHz(110, t, 0.2, "triangle", 0.07); }
  else if (name === "bell") { toneHz(1318, t, 0.07, "square", 0.04); toneHz(1568, t + 0.06, 0.1, "triangle", 0.04); }
  else if (name === "buy") { toneHz(660, t, 0.06, "square", 0.045); toneHz(880, t + 0.06, 0.1, "square", 0.04); }
  else if (name === "empty") toneHz(140, t, 0.07, "square", 0.04);
  else if (name === "splat") noise(t, 0.08, 0.04, 700);
  else if (name === "night") { toneHz(523, t, 0.1, "square", 0.05); toneHz(659, t + 0.1, 0.1, "square", 0.05); toneHz(784, t + 0.2, 0.16, "square", 0.05); }
  else if (name === "over") { toneHz(392, t, 0.14, "triangle", 0.06); toneHz(330, t + 0.12, 0.14, "triangle", 0.05); toneHz(262, t + 0.24, 0.22, "triangle", 0.05); }
  else if (name === "cocoa") { toneHz(523, t, 0.08, "square", 0.05); toneHz(659, t + 0.08, 0.08, "square", 0.05); toneHz(784, t + 0.16, 0.12, "square", 0.05); }
}
function musicTick() {
  if (!audio.ctx || muted || hostPaused || hidden || audio.ctx.state !== "running") return;
  const now = audio.ctx.currentTime;
  if (!audio.next || audio.next < now) audio.next = now + 0.05;
  let guard = 0;
  while (audio.next < now + 0.22 && guard++ < 6) {
    const lead = LEAD[audio.step % LEAD.length];
    if (lead) tone(lead, audio.next, 0.14, "square", 0.045);
    if (audio.step % 4 === 0) tone(BASS[(audio.step / 4) % BASS.length], audio.next, 0.32, "triangle", 0.06);
    if (audio.step % 2 === 0) noise(audio.next, 0.03, 0.012, 2000);
    audio.next += 0.15;
    audio.step++;
  }
}
function toggleMute() {
  muted = !muted;
  if (audio.master) audio.master.gain.value = muted ? 0 : 0.24;
  save();
  if (!muted) ensureAudio();
}

function isDevHost() {
  const h = location.hostname || "";
  return h === "localhost" || h === "127.0.0.1" || h === "0.0.0.0" || /\.grok\.(me|com)$/.test(h);
}
function attachRun(api) {
  if (!api || !api.ads || Run.api) return;
  Run.api = api;
  try {
    const env = api.system && api.system.getEnvironment ? api.system.getEnvironment() : null;
    const apply = (e) => {
      if (e && e.capabilities && typeof e.capabilities.ads === "boolean") Run.adsCapable = e.capabilities.ads;
    };
    if (env && typeof env.then === "function") env.then(apply).catch(() => {});
    else apply(env);
  } catch (e) {}
  try {
    if (api.lifecycles) {
      if (api.lifecycles.onPause) api.lifecycles.onPause(() => { hostPaused = true; });
      if (api.lifecycles.onResume) api.lifecycles.onResume(() => { hostPaused = false; });
      if (api.lifecycles.onSleep) api.lifecycles.onSleep(() => { hostPaused = true; });
      if (api.lifecycles.onAwake) api.lifecycles.onAwake(() => { hostPaused = false; });
    }
  } catch (e) {}
}
async function bootSdk() {
  try {
    if (window.RundotGameAPI) attachRun(window.RundotGameAPI);
    try { if (!Run.api && window.parent && window.parent !== window) attachRun(window.parent.RundotGameAPI); } catch (e) {}
    let mapped = false;
    document.querySelectorAll('script[type="importmap"]').forEach((n) => {
      if (n.textContent && n.textContent.indexOf("rundot-game-sdk") !== -1) mapped = true;
    });
    if (!Run.api && (mapped || !isDevHost())) {
      try {
        const mod = await import("@series-inc/rundot-game-sdk/api");
        attachRun(mod.default || mod);
      } catch (e) {}
    }
  } catch (e) {}
}
let sdkPolls = 0;
const sdkPoll = setInterval(() => {

  else if (sdkPolls > 24) clearInterval(sdkPoll);
}, 250);
bootSdk();

function withTimeout(promise, ms) {
  return new Promise((resolve) => {
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve({ timeout: true }); } }, ms);
    Promise.resolve(promise).then(
      (value) => { if (!done) { done = true; clearTimeout(timer); resolve({ value }); } },
      () => { if (!done) { done = true; clearTimeout(timer); resolve({ error: true }); } }
    );
  });
}
function toast(msg) { toasts.push({ msg, t: 2.2 }); }
let rewardedOk = false;
function bridge() {
  try { const a = window.SleighAds; return a && a.available && typeof a.isRunHost === "function" ? a : null; } catch (e) { return null; }
}
async function checkRewarded() {
  rewardedOk = false;
  try {
    const b = bridge();
    if (b) { rewardedOk = b.isRunHost() && (await withTimeout(b.isRewardedReady(), 4000)).value === true; return; }
    const api = Run.api;
    if (!api || !api.ads || Run.adsCapable === false || typeof api.ads.isRewardedAdReadyAsync !== "function") return;
    const r = await withTimeout(api.ads.isRewardedAdReadyAsync(), 4000);
    rewardedOk = r.value === true;
  } catch (e) { rewardedOk = false; }
}
function rewardOk(v) {
  return v === true || (!!v && (v.rewarded === true || v.success === true));
}
async function showRewarded(id, name) {
  const b = bridge();
  if (b) {
    if (!b.isRunHost()) { toast("NO AD AVAILABLE"); return false; }
    const r = await withTimeout(b.showRewarded({ adDisplayId: id, adDisplayName: name }), 90000);
    if (r.value === true) return true;
    toast(r.timeout ? "AD TIMED OUT" : "NO REWARD");
    return false;
  }
  const api = Run.api;
  if (!api || !api.ads || Run.adsCapable === false) { toast("NO AD AVAILABLE"); return false; }
  try {
    const ready = await withTimeout(api.ads.isRewardedAdReadyAsync(), 4000);
    if (ready.timeout || ready.error || ready.value !== true) { toast("NO AD READY"); return false; }
    const shown = await withTimeout(api.ads.showRewardedAdAsync({ adDisplayId: id, adDisplayName: name }), 90000);
    if (rewardOk(shown.value)) return true;
    toast(shown.timeout ? "AD TIMED OUT" : "NO REWARD");
    return false;
  } catch (e) {
    toast("NO AD AVAILABLE");
    return false;
  }
}
async function runInterstitial(n) {
  const b = bridge();
  if (b) {
    if (b.isRunHost()) await withTimeout(b.showInterstitial({ adDisplayId: "night_" + n, adDisplayName: "Between Nights" }), 60000);
    return;
  }
  const api = Run.api;
  if (!api || !api.ads || Run.adsCapable === false) return;
  try {
    const ready = await withTimeout(api.ads.isInterstitialAdReadyAsync(), 2500);
    if (ready.value !== true || state !== "between") return;
    const fn = api.ads.showInterstitialAd || api.ads.showInterstitialAdAsync;
    if (!fn) return;
    await withTimeout(fn.call(api.ads, { adDisplayId: "night_" + n, adDisplayName: "Between Nights" }), 60000);
  } catch (e) {}
}

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(12, 48);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 16, life: rnd(0.35, 0.7), col, g: 30 });
  }
  if (particles.length > 140) particles.splice(0, particles.length - 140);
}
function floater(x, y, text, col) {
  floaters.push({ x: clamp(x, 40, gw - 8), y, text, life: 0.9, col: col || "#fffaf3" });
}
function houseLit(h) {
  if (!h.dark) return true;
  if (!up.nose || state !== "playing") return false;
  const cx = h.x + h.w * 0.5;
  return cx > sleigh.x - 24 && cx < sleigh.x + 128;
}
function chimneyBox(h, ch) {
  const bodyTop = groundY - h.h;
  const roofTop = h.kind === "train" ? groundY - h.h - 6 : bodyTop - 8;
  const x = Math.round(h.x + ch.ox);
  const top = roofTop - 8;
  return { x, y: top, w: ch.w, h: 8, cx: x + ch.w / 2, mouth: top + 1, roofTop };
}
function smokeBox(h, ch) {
  if (night < 2 || state !== "playing") return null;
  if (h.dark && !houseLit(h)) return null;
  const phase = Math.sin(anim * 2.2 + h.seed + ch.ox);
  if (phase < 0.12) return null;

  const rows = [
    { id: "buy_bag", t: "BAG " + up.bag + "/4", d: "MORE PRESENTS", c: bagCost() },
    { id: "buy_mag", t: "MAGNET " + up.magnet + "/3", d: "CURVE TO CHIMNEY", c: magCost() },
    { id: "buy_nose", t: up.nose ? "NOSE ON" : "RUDOLPH NOSE", d: "LIGHTS DARK HOMES", c: noseCost() },
    { id: "buy_skin", t: "SKIN " + up.skin.toUpperCase(), d: nextLockedSkin() ? "NEXT " + nextLockedSkin().name : "TAP TO CHANGE", c: nextLockedSkin() ? nextLockedSkin().cost : null }
  ];
  rows.forEach((r, i) => {
    const y = py + head + i * rowH;
    const rh = Math.max(16, rowH - 4);
    button(r.id, px + 6, y, pw - 12, rh, "", r.c != null && bells >= r.c);
    drawText(r.t, px + 10, y + 3, "#fffaf3", 1, "left");
    if (rh >= 24) drawText(r.d, px + 10, y + 12, "#9fb4d0", 1, "left");
    drawText(r.c == null ? "MAX" : String(r.c), px + pw - 12, y + 3, r.c != null && bells < r.c ? "#ff8a8a" : "#f0c14a", 1, "right");
  });
  let by = py + head + 4 * rowH + 2;
  if (showDouble) {
    button("double", px + 6, by, pw - 12, 16, adBusy ? "PLEASE WAIT" : "DOUBLE BELLS", true);
    by += 18;
  }
  button("next", px + 6, by, pw - 12, 18, "NEXT NIGHT", true);
}
function drawOver() {
  const pw = Math.min(gw - 12, 200);
  const showCocoa = !revived && rewardedOk;
  const ph = showCocoa ? 140 : 118;
  const px = (gw - pw) / 2;
  const py = Math.max(safeG.top + 8, (gh - ph) / 2);
  panel(px, py, pw, ph);
  drawText("SLEIGH DOWN", gw / 2, py + 6, "#f0c14a", 1, "center");
  drawText("SCORE " + score, gw / 2, py + 18, "#fffaf3", 1, "center");
  drawText(newBest ? "NEW BEST " + best : "BEST " + best, gw / 2, py + 28, newBest ? "#f0c14a" : "#d5e4f6", 1, "center");
  drawText("NIGHT " + night, gw / 2, py + 40, "#fffaf3", 1, "center");
  drawText("FURTHEST " + bestNight, gw / 2, py + 50, "#9fb4d0", 1, "center");
  let by = py + 62;
  if (showCocoa) {
    button("cocoa", px + 8, by, pw - 16, 18, adBusy ? "PLEASE WAIT" : "EXTRA COCOA", true);
    by += 22;
  }
  button("play", px + 8, by, pw - 16, 18, "PLAY AGAIN", true);
  button("quit", px + 8, by + 20, pw - 16, 16, "TITLE", false);
}

function render() {
  uiHits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, gw, gh);
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save();
  ctx.translate(sx, sy);
  drawWorld();
  ctx.restore();
  drawSnowHint();
  if (state === "playing" || state === "pause") drawHud();
  if (state === "playing") drawControls(); else { ctrlFly = null; ctrlDrop = null; }
  drawFloaters();
  if (state === "playing") drawBanner();
  if (state === "title") drawTitle();
  else if (state === "how") drawHow();
  else if (state === "pause" || (hostPaused && state === "playing")) drawPause();
  else if (state === "between") drawBetween();
  else if (state === "shop") drawShop();
  else if (state === "gameover") drawOver();
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.imageSmoothingEnabled = false;
  mctx.fillStyle = "#071428";
  mctx.fillRect(0, 0, view.width, view.height);
  mctx.drawImage(off, ox * dpr, oy * dpr, gw * scale * dpr, gh * scale * dpr);
}

function handleEdges() {
  if (edges.has("KeyM")) toggleMute();
  if (edges.has("KeyP") || edges.has("Escape")) {
    if (state === "playing") { state = "pause"; pointerHolding = false; ptrs.clear(); sfx("ui"); }
    else if (state === "pause") { state = "playing"; sfx("ui"); }
  }
  const was = state;
  const menu = edges.has("Enter") || (edges.has("Space") && state !== "playing");
  if (menu) {
    if (state === "title" || state === "how") startRun();
    else if (state === "gameover") startRun();
    else if (state === "shop") nextNight();
    else if (state === "pause") state = "playing";
  }
}
function activate(id) {
  ensureAudio();
  if (id === "mute") { toggleMute(); return; }
  if (id === "play") { startRun(); return; }
  if (id === "how") { state = "how"; sfx("ui"); return; }
  if (id === "back") { state = "title"; sfx("ui"); return; }
  if (id === "pause") { if (state === "playing") { state = "pause"; pointerHolding = false; ptrs.clear(); sfx("ui"); } return; }
  if (id === "resume") { if (state === "pause") state = "playing"; sfx("ui"); return; }
  if (id === "quit") { commitScore(); goTitle(); sfx("ui"); return; }
  if (id === "next") { nextNight(); return; }
  if (id === "cocoa") { revive(); return; }
  if (id === "double") { doubleBells(); return; }
  if (id === "buy_bag") { tryBuy(bagCost(), () => { up.bag++; }); return; }
  if (id === "buy_mag") { tryBuy(magCost(), () => { up.magnet++; }); return; }
  if (id === "buy_nose") { tryBuy(noseCost(), () => { up.nose = 1; }); return; }
  if (id === "buy_skin") {
    const n = nextLockedSkin();
    if (!n) { cycleSkin(); return; }
    tryBuy(n.cost, () => { unlocked.add(n.id); up.skin = n.id; });
    return;
  }
}

view.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { view.setPointerCapture(e.pointerId); } catch (err) {}
  view.focus();
  ensureAudio();
  const p = toGame(e);
  if (state === "playing") {
    if (inRect(p, ctrlDrop)) { ptrs.set(e.pointerId, "drop"); tryDrop(); return; }
    if (inRect(p, ctrlFly)) { ptrs.set(e.pointerId, "fly"); return; }
  }
  const id = hitUI(p.x, p.y);
  if (id) { activate(id); return; }
  // Holding anywhere else on the play area also flies (mouse/touch convenience).
  if (state === "playing") ptrs.set(e.pointerId, "canvas");
});
function releasePtr(e) { ptrs.delete(e.pointerId); }
view.addEventListener("pointerup", releasePtr);
view.addEventListener("pointercancel", releasePtr);
view.addEventListener("lostpointercapture", releasePtr);
view.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
  if (state === "playing" && !qaKeys && (e.code === "ArrowDown" || e.code === "KeyS" || e.code === "KeyX" || e.code === "Enter")) { e.preventDefault(); tryDrop(); }
  keys.add(e.code);
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => { keys.clear(); ptrs.clear(); pointerHolding = false; ptrs.clear(); });
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "sde-key" || typeof d.code !== "string") return;
  if (d.down) keys.add(d.code); else keys.delete(d.code);
});
document.addEventListener("visibilitychange", () => {
  hidden = document.hidden;
  if (!hidden && audio.ctx && !muted) audio.ctx.resume();
});
window.addEventListener("resize", resize);

let last = performance.now();
let acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (gw < 20) resize();
  pollEdges();
  handleEdges();
  acc += dt;
  let steps = 0;
  while (acc >= 1 / 60 && steps++ < 5) {
    sim(1 / 60);
    acc -= 1 / 60;
  }
  render();
  musicTick();
  requestAnimationFrame(frame);
}

loadSave();
resize();
goTitle();
requestAnimationFrame(frame);

window.__controlsTest = {
  setKeys(codes) { qaKeys = codes && codes.length ? new Set(codes) : null; },
  getPos() { return { x: sleigh.x, y: sleigh.y }; },
  getSpeed() { return Math.abs(sleigh.vy) + (state === "playing" ? speed() * 0.15 : 0); }
};
window.__sde = {
  start() { startRun(); },
  toggleMute() { toggleMute(); },
  getState() {
    return {
      state, night, score, best, bestNight, mugs, bells, bag,
      x: sleigh.x, y: sleigh.y, vy: sleigh.vy,
      presents: presents.length, houses: houses.length
    };
  }
};
</script>
</body>
</html>
