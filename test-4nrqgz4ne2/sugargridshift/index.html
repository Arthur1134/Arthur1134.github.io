<body><canvas id="c" width="360" height="640"></canvas><script>
// ===== Sugar Grid Shift core (pure logic) =====
var GW=7,GH=8;
function mkRng(s){s=s>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
var _tid=1;
function mkTile(f){return {f:f,bomb:false,wrap:false,id:_tid++};}
function cloneTile(t){return t?{f:t.f,bomb:t.bomb,wrap:t.wrap,id:t.id}:null;}
function newState(lv,seed){
  var st={lv:lv,seedN:seed>>>0,rng:null,t:[],ice:[],moves:lv.moves,used:0,gifts:0,score:0,chain:0,bombsMade:0};
  st.rng=mkRng(seed);
  for(var y=0;y<GH;y++){st.t.push([]);st.ice.push([]);for(var x=0;x<GW;x++){st.t[y].push(null);st.ice[y].push(0);}}
  (lv.ice||[]).forEach(function(c){st.ice[c[1]][c[0]]=c[2]||1;});
  var tries=0;
  do{fillFresh(st);tries++;}while(!hasMove(st)&&tries<50);
  (lv.wrap||[]).forEach(function(c){var t=st.t[c[1]][c[0]];if(t)t.wrap=true;});
  if(!hasMove(st))shuffle(st);
  return st;
}
function rf(st){return Math.floor(st.rng()*st.lv.flavors);}
function fillFresh(st){
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var bad=-1;
    if(x>0&&y>0){var a=st.t[y][x-1],b=st.t[y-1][x],c=st.t[y-1][x-1];if(a&&b&&c&&a.f===b.f&&b.f===c.f)bad=a.f;}
    var f;do{f=rf(st);}while(f===bad);
    st.t[y][x]=mkTile(f);
  }
}
function sqAt(t,x,y){if(x<0||y<0||x>=GW-1||y>=GH-1)return false;var a=t[y][x],b=t[y][x+1],c=t[y+1][x],d=t[y+1][x+1];
  return a&&b&&c&&d&&!a.bomb&&!b.bomb&&!c.bomb&&!d.bomb&&a.f===b.f&&a.f===c.f&&a.f===d.f;}
function findSquares(t){var r=[];for(var y=0;y<GH-1;y++)for(var x=0;x<GW-1;x++)if(sqAt(t,x,y))r.push([x,y]);return r;}
function sqNear(t,x,y){for(var dy=-1;dy<=0;dy++)for(var dx=-1;dx<=0;dx++)if(sqAt(t,x+dx,y+dy))return true;return false;}
function canSwapCells(st,ax,ay,bx,by){var a=st.t[ay][ax],b=st.t[by][bx];if(!a||!b||a.wrap||b.wrap)return false;
  if(a.bomb||b.bomb)return true;if(a.f===b.f)return false;
  st.t[ay][ax]=b;st.t[by][bx]=a;var ok=sqNear(st.t,ax,ay)||sqNear(st.t,bx,by);st.t[ay][ax]=a;st.t[by][bx]=b;return ok;}
function listMoves(st){var m=[];for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
  if(x<GW-1&&canSwapCells(st,x,y,x+1,y))m.push([x,y,x+1,y]);
  if(y<GH-1&&canSwapCells(st,x,y,x,y+1))m.push([x,y,x,y+1]);}return m;}
function hasMove(st){return listMoves(st).length>0;}
function shuffle(st){
  for(var k=0;k<60;k++){
    var pool=[];for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var t=st.t[y][x];if(t&&!t.wrap&&!t.bomb)pool.push(t);}
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(st.rng()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
    var p=0;for(var y2=0;y2<GH;y2++)for(var x2=0;x2<GW;x2++){var t2=st.t[y2][x2];if(t2&&!t2.wrap&&!t2.bomb)st.t[y2][x2]=pool[p++];}
    if(findSquares(st.t).length===0&&hasMove(st))return true;
  }
  // fallback: recolor freely
  for(var y3=0;y3<GH;y3++)for(var x3=0;x3<GW;x3++){var t3=st.t[y3][x3];if(t3&&!t3.wrap&&!t3.bomb)t3.f=rf(st);}
  if(findSquares(st.t).length||!hasMove(st))return shuffle(st);
  return true;
}
// hit cells: returns {cells:[[x,y]...],gifts,iceHits,wrapHits,bomb:[x,y]|null}
function popCells(st,cells,ev){
  var hit={};var key=function(x,y){return y*GW+x;};
  cells.forEach(function(c){hit[key(c[0],c[1])]=1;});
  var iceHit={};
  cells.forEach(function(c){var x=c[0],y=c[1];
    var t=st.t[y][x];if(t&&t.wrap){ev.wraps.push([x,y]);}
    if(t)ev.popped.push({x:x,y:y,f:t.f,bomb:t.bomb});
    st.t[y][x]=null;iceHit[key(x,y)]=[x,y];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=GW||ny>=GH)return;
      if(!hit[key(nx,ny)]){iceHit[key(nx,ny)]=[nx,ny];var nt=st.t[ny][nx];if(nt&&nt.wrap){nt.wrap=false;ev.wraps.push([nx,ny]);}}});
  });
  for(var k in iceHit){var c=iceHit[k];if(st.ice[c[1]][c[0]]>0){st.ice[c[1]][c[0]]--;ev.ices.push([c[0],c[1],st.ice[c[1]][c[0]]]);}}
}
function newEv(){return {popped:[],wraps:[],ices:[],squares:[],gifts:0,bomb:null,points:0};}
function resolveStep(st){
  var sq=findSquares(st.t);if(!sq.length)return null;
  st.chain++;var ev=newEv();ev.squares=sq;ev.chain=st.chain;
  var cells={},list=[];sq.forEach(function(s){[[0,0],[1,0],[0,1],[1,1]].forEach(function(d){var x=s[0]+d[0],y=s[1]+d[1],k=y*GW+x;if(!cells[k]){cells[k]=1;list.push([x,y]);}});});
  popCells(st,list,ev);
  ev.gifts=sq.length;st.gifts+=sq.length;
  ev.points=(list.length*10+sq.length*50)*st.chain;st.score+=ev.points;
  if(list.length>=7||(st.chain===3)){var b=list[0];var bt=mkTile(-1);bt.bomb=true;st.t[b[1]][b[0]]=bt;ev.bomb=b;st.bombsMade++;}
  return ev;
}
function bombBlast(st,ax,ay,bx,by){
  var a=st.t[ay][ax],b=st.t[by][bx];var ev=newEv();st.chain++;ev.chain=st.chain;ev.blast=[ax,ay];
  var list=[];
  if(a.bomb&&b.bomb){for(var y=0;y<GH;y++)for(var x=0;x<GW;x++)if(st.t[y][x])list.push([x,y]);}
  else{var f=a.bomb?b.f:a.f;list.push([ax,ay]);if(!(ax===bx&&ay===by))list.push([bx,by]);
    for(var y2=0;y2<GH;y2++)for(var x2=0;x2<GW;x2++){var t=st.t[y2][x2];if(t&&!t.bomb&&t.f===f&&!((x2===ax&&y2===ay)||(x2===bx&&y2===by)))list.push([x2,y2]);}}
  popCells(st,list,ev);var g=Math.floor(list.length/4);ev.gifts=g;st.gifts+=g;ev.points=list.length*15;st.score+=ev.points;return ev;
}
// gravity: returns array of {t,fromY,toY,x,spawn}
function gravity(st){var mv=[];
  for(var x=0;x<GW;x++){var w=GH-1;
    for(var y=GH-1;y>=0;y--){var t=st.t[y][x];if(t){if(y!==w){st.t[w][x]=t;st.t[y][x]=null;mv.push({t:t,x:x,fromY:y,toY:w});}w--;}}
    var n=0;for(var y2=w;y2>=0;y2--){n++;var nt=mkTile(rf(st));st.t[y2][x]=nt;mv.push({t:nt,x:x,fromY:-n,toY:y2,spawn:true});}
  }return mv;}
function rotateBelts(st){var mv=[];(st.lv.belts||[]).forEach(function(b){var row=st.t[b.row];
  if(b.dir>0){var last=row.pop();row.unshift(last);}else{var first=row.shift();row.push(first);}
  for(var x=0;x<GW;x++){var t=row[x];if(t)mv.push({t:t,row:b.row,x:x,dir:b.dir});}});return mv;}
function iceLeft(st){var n=0;for(var y=0;y<GH;y++)for(var x=0;x<GW;x++)if(st.ice[y][x]>0)n++;return n;}
function wrapLeft(st){var n=0;for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var t=st.t[y][x];if(t&&t.wrap)n++;}return n;}
function goalsMet(st){var g=st.lv.goals;
  if(g.gifts&&st.gifts<g.gifts)return false;if(g.ice&&iceLeft(st)>0)return false;if(g.wrap&&wrapLeft(st)>0)return false;if(g.score&&st.score<g.score)return false;return true;}
function settleAll(st){while(true){var ev=resolveStep(st);if(!ev)break;gravity(st);}}
// synchronous full move (for bots/hints)
function playMove(st,m){var ax=m[0],ay=m[1],bx=m[2],by=m[3];st.chain=0;
  var a=st.t[ay][ax],b=st.t[by][bx];
  if(a.bomb||b.bomb){bombBlast(st,ax,ay,bx,by);gravity(st);}
  else{st.t[ay][ax]=b;st.t[by][bx]=a;}
  settleAll(st);
  if(st.lv.belts&&st.lv.belts.length){rotateBelts(st);settleAll(st);}
  st.moves--;st.used++;
  if(!hasMove(st))shuffle(st);
}
function cloneState(st,seed){var c={lv:st.lv,rng:mkRng(seed),t:[],ice:[],moves:st.moves,used:st.used,gifts:st.gifts,score:st.score,chain:0,bombsMade:st.bombsMade};
  for(var y=0;y<GH;y++){c.t.push(st.t[y].map(cloneTile));c.ice.push(st.ice[y].slice());}return c;}
function progress(st){var g=st.lv.goals,v=0;
  if(g.gifts)v+=Math.min(st.gifts,g.gifts)*10;if(g.ice)v-=iceLeft(st)*14;if(g.wrap)v-=wrapLeft(st)*16;if(g.score)v+=Math.min(st.score,g.score)/40;
  v+=st.bombsMade*3;return v;}
function bestMove(st,r){var ms=listMoves(st);if(!ms.length)return null;var base=progress(st),best=null,bv=-1e9;
  ms.forEach(function(m){var c=cloneState(st,(r()*1e9)|0);playMove(c,m);var v=progress(c)-base+(goalsMet(c)?1000:0)+r()*0.5;
    // prefer not spending bombs early unless helpful
    if(v>bv){bv=v;best=m;}});return best;}

// ===== Sugar Grid Shift v1.0.0 — Made by Retro Gaming Dad · Arthur McConnell =====
var VERSION='1.0.0';
var CW=360,CH=640,TS=48,GX=12,GY=128;
var cv=document.getElementById('c'),cx=cv.getContext('2d'),DPR=1;
function resize(){var s=Math.min(innerWidth/CW,innerHeight/CH);DPR=Math.min(3,(window.devicePixelRatio||1)*s);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=Math.round(CW*s)+'px';cv.style.height=Math.round(CH*s)+'px';buildSprites();}
var FL=[
 {n:'Strawberry',c:'#ffa3bf',d:'#e3628f',s:'heart'},
 {n:'Mint',c:'#a4ecc9',d:'#3fb088',s:'leaf'},
 {n:'Lemon',c:'#ffe68f',d:'#e2aa2a',s:'star'},
 {n:'Blueberry',c:'#accbff',d:'#5a7fdb',s:'dot'},
 {n:'Grape',c:'#d3b6ff',d:'#8b62dc',s:'diamond'}];
// ---------- save ----------
var SAVE={unlocked:1,stars:{},best:{},music:true,sfx:true,daily:{}};
try{var sv=JSON.parse(localStorage.getItem('sgs_save_v1'));if(sv)for(var k in sv)SAVE[k]=sv[k];}catch(e){}
function save(){try{localStorage.setItem('sgs_save_v1',JSON.stringify(SAVE));}catch(e){}}
// ---------- ad hooks (no-op until RUN build) ----------
window.SGSAds=window.SGSAds||{rewarded:function(kind,cb){cb(true);}};
// ---------- audio ----------
var AC=null,master,musG,sfxG;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
  musG=AC.createGain();musG.gain.value=SAVE.music?0.32:0;musG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=SAVE.sfx?0.6:0;sfxG.connect(master);startMusic();}
function setMix(){if(!AC)return;musG.gain.setTargetAtTime(SAVE.music?0.32:0,AC.currentTime,0.05);sfxG.gain.setTargetAtTime(SAVE.sfx?0.6:0,AC.currentTime,0.05);}
function tone(f,t,d,type,vol,dest,slide){var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+d+0.05);}
function mf(n){return 440*Math.pow(2,(n-69)/12);}
var SFX={
 swap:function(){var t=AC.currentTime;tone(520,t,0.08,'triangle',0.15,null,780);},
 bad:function(){var t=AC.currentTime;tone(220,t,0.12,'square',0.06,null,160);tone(180,t+0.1,0.14,'square',0.05,null,130);},
 pop:function(ch){var t=AC.currentTime,b=72+Math.min(ch,8)*2;tone(mf(b),t,0.12,'sine',0.25,null,mf(b+12));tone(mf(b+7),t+0.05,0.15,'triangle',0.15);
   var n=AC.createBufferSource(),bf=AC.createBuffer(1,AC.sampleRate*0.08,AC.sampleRate),d=bf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
   n.buffer=bf;var fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=1800;var g=AC.createGain();g.gain.value=0.25;n.connect(fl);fl.connect(g);g.connect(sfxG);n.start(t);},
 gift:function(){var t=AC.currentTime;[84,88,91].forEach(function(n,i){tone(mf(n),t+i*0.05,0.25,'sine',0.12);});},
 ice:function(){var t=AC.currentTime;tone(2400,t,0.09,'triangle',0.08,null,1800);tone(3100,t+0.03,0.08,'sine',0.06);},
 ribbon:function(){var t=AC.currentTime;tone(900,t,0.1,'sawtooth',0.04,null,1400);},
 bomb:function(){var t=AC.currentTime;for(var i=0;i<8;i++)tone(mf(72+i*3),t+i*0.035,0.2,'triangle',0.12);tone(90,t,0.4,'sine',0.3,null,40);},
 belt:function(){var t=AC.currentTime;tone(300,t,0.06,'square',0.04);tone(340,t+0.07,0.06,'square',0.04);},

 click:function(){var t=AC.currentTime;tone(880,t,0.05,'sine',0.1);},

};
function sfx(n,a){if(AC&&SAVE.sfx)try{SFX[n](a);}catch(e){}}
// music: music-box waltz-ish pop, two sections
var SONG=(function(){
  var prog=[[60,64,67],[57,60,64],[53,57,60],[55,59,62],[60,64,67],[57,60,64],[50,53,57],[55,59,62]];
  var prog2=[[53,57,60],[55,59,62],[52,55,59],[57,60,64],[50,53,57],[55,59,62],[60,64,67],[55,59,65]];
  var melA=[76,74,72,74,76,76,76,-1,74,74,74,-1,76,79,79,-1,76,74,72,74,76,76,76,76,74,74,76,74,72,-1,-1,-1];
  var melB=[72,74,76,77,79,-1,77,76,74,76,77,79,81,-1,79,-1,77,76,74,72,74,-1,76,-1,72,71,72,74,72,-1,-1,-1];
  return {prog:prog,prog2:prog2,melA:melA,melB:melB};})();
var mStep=0,mNext=0,mTimer=null,BEAT=60/104/2;

function schedMusic(){if(!AC)return;while(mNext<AC.currentTime+0.25){playStep(mStep,mNext);mStep=(mStep+1)%128;mNext+=BEAT;}}
function playStep(s,t){if(!SAVE.music)return;var sec=Math.floor(s/64)%2,ls=s%64,bar=Math.floor(ls/8),pos=ls%8;

  if(pos%2===0){var n=mel[(ls>>1)%32];if(n>0){tone(mf(n),t,BEAT*2.4,'sine',0.11,musG);tone(mf(n+12),t,BEAT*0.8,'sine',0.025,musG);}}
  if(pos===2||pos===6){var b=AC.createBufferSource(),bf=AC.createBuffer(1,AC.sampleRate*0.03,AC.sampleRate),d=bf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    b.buffer=bf;var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;var g=AC.createGain();g.gain.value=0.08;b.connect(hp);hp.connect(g);g.connect(musG);b.start(t);}}
// ---------- sprites ----------
var SPR=[],BOMB=null;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shape(c,s,cx_,cy,r){c.beginPath();
  if(s==='heart'){c.moveTo(cx_,cy+r*0.8);c.bezierCurveTo(cx_-r*1.3,cy-r*0.1,cx_-r*0.6,cy-r*1.1,cx_,cy-r*0.4);c.bezierCurveTo(cx_+r*0.6,cy-r*1.1,cx_+r*1.3,cy-r*0.1,cx_,cy+r*0.8);}
  else if(s==='leaf'){c.moveTo(cx_,cy-r);c.quadraticCurveTo(cx_+r*1.1,cy,cx_,cy+r);c.quadraticCurveTo(cx_-r*1.1,cy,cx_,cy-r);}
  else if(s==='star'){for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rd=i%2?r*0.45:r;c.lineTo(cx_+Math.cos(a)*rd,cy+Math.sin(a)*rd);}}

  else if(s==='diamond'){c.moveTo(cx_,cy-r);c.lineTo(cx_+r*0.8,cy);c.lineTo(cx_,cy+r);c.lineTo(cx_-r*0.8,cy);}
  c.closePath();}
function buildSprites(){var px=Math.ceil(TS*DPR);SPR=FL.map(function(f){var o=document.createElement('canvas');o.width=o.height=px;var c=o.getContext('2d');c.scale(DPR,DPR);
  var g=c.createLinearGradient(0,0,0,TS);g.addColorStop(0,'#fff');g.addColorStop(0.18,f.c);g.addColorStop(1,f.d);
  rr(c,3,3,TS-6,TS-6,12);c.fillStyle=f.d;c.fill();rr(c,3,2,TS-6,TS-8,12);c.fillStyle=g;c.fill();
  c.fillStyle='rgba(255,255,255,0.45)';rr(c,9,6,TS-22,7,4);c.fill();
  shape(c,f.s,TS/2,TS/2+2,11);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle=f.d;c.stroke();
  shape(c,f.s,TS/2-2,TS/2,4);c.fillStyle='rgba(255,255,255,0.7)';c.fill();return o;});
  var o=document.createElement('canvas');o.width=o.height=px;var c=o.getContext('2d');c.scale(DPR,DPR);
