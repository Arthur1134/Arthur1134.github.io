const VERSION='0.2.0',W=360,H=640,LN=3,LX=[90,180,270],CY=540,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;

const AC=new (window.AudioContext||window.webkitAudioContext)();

const MUS=AC.createGain();MUS.gain.value=.55;MUS.connect(MASTER);
const SFX=AC.createGain();SFX.gain.value=1;SFX.connect(MASTER);
let NOISE;{const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}
function tone(f,d=.1,t='square',v=.05,when=0,dest=SFX,glide=0){try{const st=AC.currentTime+when,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,st);if(glide)o.frequency.exponentialRampToValueAtTime(glide,st+d);a.gain.setValueAtTime(v,st);a.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(a).connect(dest);o.start(st);o.stop(st+d+.02)}catch(e){}}

// ---- Mixtape styles (original patterns). 16 steps per bar; x=hit
const STY=[
 {n:'Boombox Bounce',k:'x...x.....x.x...',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',prog:[0,0,-4,-2],bass:'x..x..x.x..x.x..',bw:'square',lw:'square',lead:[0,3,7,10,7,3,5,7],root:110},
 {n:'Walkman Pop',k:'x...x...x...x...',s:'....x.......x..x',h:'.x.x.x.x.x.x.x.x',prog:[0,-5,-3,-7],bass:'x.x.x.x.x.x.x.x.',bw:'triangle',lw:'square',lead:[7,5,3,5,7,7,10,7],root:130.8},
 {n:'Chrome Synthwave',k:'x...x...x...x...',s:'....x.......x...',h:'xxxxxxxxxxxxxxxx',prog:[0,-4,-7,-2],bass:'xxxxxxxxxxxxxxxx',bw:'sawtooth',lw:'sawtooth',lead:[12,10,7,3,5,7,10,15],root:98},
 {n:'Dolby Night Drive',k:'x......xx.x.....',s:'....x.......x...',h:'x.xxx.xxx.xxx.xx',prog:[0,3,-2,-4],bass:'x..x..x...x..x..',bw:'square',lw:'triangle',lead:[0,7,12,10,7,5,3,5],root:116.5},
 {n:'Hi-Bias Arcade',k:'x.x...x.x.x...x.',s:'....x..x....x...',h:'x.x.x.x.x.x.x.x.',prog:[0,5,3,-2],bass:'x.xx.xx.x.xx.xx.',bw:'square',lw:'square',lead:[12,15,12,10,7,10,12,19],root:138.6},
 {n:'Metal IV Overdrive',k:'x.x.x.x.x.x.x.x.',s:'....x.......x.xx',h:'xxxxxxxxxxxxxxxx',prog:[0,-2,-4,-5],bass:'xxxxxxxxxxxxxxxx',bw:'sawtooth',lw:'square',lead:[0,12,10,12,7,12,5,3],root:82.4}];
const DECKS=[
 {n:'BOOMBOX 84',bpm:96,c:'#ff4fa3',c2:'#3de0ff'},
 {n:'WALKMAN XR',bpm:112,c:'#ffd23d',c2:'#7b5cff'},
 {n:'CHROME ZX-9',bpm:128,c:'#4dff9b',c2:'#ff6a3d'},
 {n:'DOLBY NIGHTS',bpm:118,c:'#7b5cff',c2:'#ffd23d'},
 {n:'HI-BIAS 90',bpm:136,c:'#ff6a3d',c2:'#4dff9b'},
 {n:'METAL TYPE IV',bpm:148,c:'#3de0ff',c2:'#ff4fa3'}];
const SCALE=[0,3,5,7,10,12,15];
let save;try{save=JSON.parse(localStorage.tddSave||'{}')}catch(e){save={}}
save.unlocked=Math.max(1,Math.min(DECKS.length,save.unlocked|0||1));save.best=save.best|0;if(save.music===undefined)save.music=true;
function persist(){try{localStorage.tddSave=JSON.stringify(save)}catch(e){}}persist();
let state='title',deck=0,side='A',lane=1,notes=[],beat=0,stretch=0,score=0,combo=0,hits=0,misses=0,len=48,rewound,tracks=0,menuSel=0,shiftFlash=0,particles=[],bf=0,btns=[],mClock=0,lastStep=-1,confirmT=0;
function setMusic(on){save.music=on;persist();MUS.gain.setTargetAtTime(on?.55:0,AC.currentTime,.05)}
setMusic(save.music);
function duck(on){if(save.music)MUS.gain.setTargetAtTime(on?.12:.55,AC.currentTime,.08)}
// play one 16th step of deck style
function musicStep(di,step,pitch){const S=STY[di],i=step%16,bar=Math.floor(step/16)%4,r=S.root*Math.pow(2,S.prog[bar]/12)*pitch,sp=60/DECKS[di].bpm/4;
 if(S.k[i]=='x')tone(150,.18,'sine',.5,0,MUS,40);
 if(S.s[i]=='x'){noise(.14,.25,1200);tone(190,.08,'triangle',.12,0,MUS,120)}
 if(S.h[i]=='x')noise(.035,i%4==2?.09:.05,7000);
 if(S.bass[i]=='x')tone(r*(i%8==6?2:1),sp*.9,S.bw,.11,0,MUS);
 if(i%2==0&&!(bar==3&&i>8)){const n=S.lead[(i/2+bar*3)%8];if((step*7+bar)%5!=0)tone(r*4*Math.pow(2,n/12),sp*1.6,S.lw,.035,0,MUS)}
 if(i==0){[0,3,7].forEach((n,j)=>tone(r*2*Math.pow(2,n/12),sp*14,'triangle',.022,0,MUS))}}
function genTrack(d,s){const B=s=='B';len=(B?64:48)+d*8;notes=[];let l=1;
 const dens=Math.min(.95,(B?.82:.68)+d*.03),tang=(B?.16:.09)+d*.025,off=(B?.22:.06)+d*.05;
 for(let b=4;b<len;b++){if(Math.random()<dens){l=Math.max(0,Math.min(2,l+(Math.random()*3|0)-1));notes.push({b,l,k:Math.random()<tang?'tangle':'note',p:SCALE[Math.random()*7|0]})}
  if(Math.random()<off&&b+.5<len)notes.push({b:b+.5,l:Math.max(0,Math.min(2,l+(Math.random()<.5?-1:1))),k:d>=4&&Math.random()<.2?'tangle':'note',p:SCALE[Math.random()*7|0]})}
 notes=notes.filter(n=>!(n.k=='tangle'&&notes.some(m=>m!==n&&Math.abs(m.b-n.b)<.01&&m.k=='note'&&m.l==n.l)))}
function startTrack(d,s){deck=d;side=s;genTrack(d,s);beat=-2;stretch=0;score=0;combo=0;hits=0;misses=0;rewound=false;lane=1;lastStep=-9;particles=[];state='play';bf=0}
function restartTrack(){duck(false);startTrack(deck,side)}
function rate(){return 1-stretch*.55}
function shift(dl){if(state!='play')return;const nl=lane+dl;if(nl<0||nl>2)return;lane=nl;
 const ph=Math.abs(beat*2-Math.round(beat*2));if(ph<.18){shiftFlash=10;score+=5}tone(300+lane*80,.04,'triangle',.03)}
function pause(){if(state!='play')return;state='pause';bf=0;duck(true);tone(500,.08,'square',.04,0,SFX,250)}
function resume(){state='play';duck(false)}
let last=0;
function update(dt){
 if(state=='title'||state=='menu'||state=='howto'||state=='credits'){mClock+=dt*DECKS[state=='menu'?(menuItems()[menuSel]||{d:0}).d:0].bpm/60;const st=Math.floor(mClock*4);if(st>lastStep){lastStep=st;musicStep(state=='menu'?(menuItems()[menuSel]||{d:0}).d:0,st,1)}return}
 if(state!='play')return;const D=DECKS[deck],bps=D.bpm/60;beat+=dt*bps*rate();
 const st=Math.floor(beat*4);if(st>lastStep){lastStep=st;if(st>=0&&beat<len)musicStep(deck,st,1-stretch*.2);else if(st<0&&st%4==0)tone(1200,.05,'square',.04,0,SFX)}
 for(const n of notes){if(n.done)continue;const d=n.b-beat;
  if(Math.abs(d)<.18&&n.l==lane){n.done=true;if(n.k=='note'){hits++;combo++;score+=10*(1+Math.floor(combo/8));stretch=Math.max(0,stretch-.02);tone(880*Math.pow(2,n.p/12)*(1-stretch*.25),.12,'square',.035);for(let i=0;i<8;i++)particles.push({x:LX[lane],y:CY,vx:Math.random()*4-2,vy:-Math.random()*4,t:25,c:D.c})}
   else{miss(.12);tone(90,.25,'sawtooth',.08)}}
  else if(d<-.18){n.done=true;if(n.k=='note')miss(.07)}}
 if(stretch>=1){if(!rewound){state='rewind';bf=0;duck(true)}else end(false);return}
 if(beat>len+1)end(true)}
function miss(a){misses++;combo=0;stretch=Math.min(1,stretch+a);tone(120*(1-stretch*.3),.2,'sawtooth',.04)}
function end(ok){state=ok?'clear':'over';bf=0;duck(true);const total=notes.filter(n=>n.k=='note').length;
 window._unl=false;if(ok&&side=='B'&&deck+1<DECKS.length&&save.unlocked<deck+2){save.unlocked=deck+2;window._unl=true}
 if(score>save.best)save.best=score;persist();tracks++;window._acc=Math.round(hits/Math.max(1,total)*100);
 if(ok)[0,4,7,12].forEach((n,i)=>tone(523*Math.pow(2,n/12),.25,'square',.05,i*.1));else[0,-3,-6].forEach((n,i)=>tone(220*Math.pow(2,n/12),.3,'sawtooth',.05,i*.15))}
async function rewind(take){if(take){const ok=await RunAds.showRewarded();if(ok){stretch=.3;rewound=true;state='play';duck(false);return}}rewound=true;end(false)}
async function toMenu(){if(tracks%2==0&&tracks>0)await RunAds.showInterstitial();duck(false);state='menu';lastStep=-1;mClock=0}
function goTitle(){duck(false);state='title';bf=0;lastStep=-1;mClock=0}
function menuItems(){const it=[];for(let d=0;d<DECKS.length;d++){it.push({d,s:'A',lock:d>=save.unlocked});it.push({d,s:'B',lock:d>=save.unlocked})}return it}
function menuPick(i){const m=menuItems()[i];if(!m||m.lock){tone(100,.1);return}startTrack(m.d,m.s)}
function nextSide(){if(side=='A')return{d:deck,s:'B'};if(deck+1<save.unlocked)return{d:deck+1,s:'A'};return null}
const PB={x:312,y:10,w:34,h:30};
// input
function act(){const b=btns[bf];if(b){tone(660,.05,'square',.03);b.f()}}
addEventListener('keydown',e=>{AC.resume();const k=e.key;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();

 if(state=='play'){if(k=='ArrowLeft'||k=='a'||k=='A')shift(-1);if(k=='ArrowRight'||k=='d'||k=='D')shift(1);if(k=='Escape'||k=='p'||k=='P')pause();return}

 if(state=='menu'){const N=menuItems().length;if(k=='ArrowUp'||k=='w')menuSel=(menuSel+N-2)%N;if(k=='ArrowDown'||k=='s')menuSel=(menuSel+2)%N;if(k=='ArrowLeft'||k=='ArrowRight')menuSel^=1;if(k==' '||k=='Enter')menuPick(menuSel);if(k=='Escape'||k=='Backspace')goTitle();return}
 if((state=='howto'||state=='credits')&&(k=='Escape'||k=='Backspace')){goTitle();return}
 if(state=='rewind'){if(k=='y')return rewind(true);if(k=='n'||k=='Escape')return rewind(false)}
 if(k=='ArrowUp'||k=='w')bf=(bf+btns.length-1)%Math.max(1,btns.length);
 if(k=='ArrowDown'||k=='s'||k=='Tab'){bf=(bf+1)%Math.max(1,btns.length);e.preventDefault()}
 if(k==' '||k=='Enter')act()});
cv.addEventListener('pointerdown',e=>{AC.resume();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 if(state=='play'){if(x>PB.x-8&&y<PB.y+PB.h+10){pause();return}shift(x<W/2?-1:1);return}
 for(let i=0;i<btns.length;i++){const b=btns[i];if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){bf=i;act();return}}
 if(state=='menu'){menuItems().forEach((m,i)=>{const bx=i%2?186:14,by=MY+(i>>1)*76;if(x>bx&&x<bx+160&&y>by-16&&y<by+56){menuSel=i;menuPick(i)}})}});
function txt(s,x,y,c='#fff',sz=14,glow=0){g.fillStyle=c;g.font='bold '+sz+'px Courier New';g.textAlign='center';if(glow){g.shadowColor=c;g.shadowBlur=glow}g.fillText(s,x,y);g.shadowBlur=0}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function cassette(x,y,w,c,c2,lock,t){const h=w*.62;
 const bg=g.createLinearGradient(x,y,x,y+h);bg.addColorStop(0,lock?'#444':c);bg.addColorStop(1,lock?'#222':shade(c));g.fillStyle=bg;rr(x,y,w,h,w*.05);g.fill();g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=Math.max(1,w/80);g.stroke();
 g.fillStyle=lock?'#666':'#f4ecd8';rr(x+w*.07,y+w*.06,w*.86,w*.1,2);g.fill();if(w>70){g.fillStyle=lock?'#444':c2;g.fillRect(x+w*.1,y+w*.09,w*.5,w*.02);g.fillRect(x+w*.1,y+w*.12,w*.3,w*.015)}
 g.fillStyle='#111';rr(x+w*.12,y+w*.2,w*.76,w*.26,w*.05);g.fill();
 g.fillStyle='rgba(120,70,40,.9)';g.fillRect(x+w*.38,y+w*.27,w*.24,w*.12);
 for(const [i,cx] of [[0,x+w*.3],[1,x+w*.7]]){const rad=w*.09;g.fillStyle='#5a3418';g.beginPath();g.arc(cx,y+w*.33,rad*(i?0.9:1.25),0,7);g.fill();
  g.fillStyle=lock?'#555':c2;g.beginPath();g.arc(cx,y+w*.33,rad*.62,0,7);g.fill();g.strokeStyle='#111';g.lineWidth=Math.max(1,w/60);
  for(let k=0;k<3;k++){const a=t+k*2.094;g.beginPath();g.moveTo(cx+Math.cos(a)*rad*.2,y+w*.33+Math.sin(a)*rad*.2);g.lineTo(cx+Math.cos(a)*rad*.6,y+w*.33+Math.sin(a)*rad*.6);g.stroke()}}
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.moveTo(x+w*.2,y+h);g.lineTo(x+w*.26,y+h*.8);g.lineTo(x+w*.74,y+h*.8);g.lineTo(x+w*.8,y+h);g.fill();
 g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x+w*.03,y+w*.02,w*.94,w*.015)}

const STARS=Array.from({length:50},(_,i)=>({x:(i*73.1)%W,y:(i*41.3)%170,p:i}));

 const sr=60+pulse*4;const sg=g.createLinearGradient(0,200-sr,0,200);sg.addColorStop(0,'#fff27a');sg.addColorStop(1,'#ff4fa3');g.shadowColor='#ff9a3d';g.shadowBlur=30;g.fillStyle=sg;g.beginPath();g.arc(180,200,sr,Math.PI,0);g.fill();g.shadowBlur=0;
 g.fillStyle='#3a0d5e';for(let i=0;i<6;i++)g.fillRect(100,200-sr*.75+i*11,160,2+i*.8);
