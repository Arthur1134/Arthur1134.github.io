<canvas id="c"></canvas>
<script>
/* ===== RUN Ads SDK stubs (wire to real RUN SDK at deploy time) ===== */
const RunAds={

    return true /* stub: grant reward locally */}
};
/* ===== Tape Deck Drift ===== */
const VERSION='0.1.1',W=360,H=640,LN=3,LX=[90,180,270],CY=540,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const AC=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d=.1,t='square',v=.05){try{const o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.value=f;a.gain.value=v;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const DECKS=[{n:'BOOMBOX 84',bpm:96,c:'#ff4fa3',c2:'#3de0ff'},{n:'WALKMAN XR',bpm:112,c:'#ffd23d',c2:'#7b5cff'},{n:'CHROME ZX-9',bpm:128,c:'#4dff9b',c2:'#ff6a3d'}];

let save=JSON.parse(localStorage.tddSave||'{"unlocked":1,"best":0}');

function startTrack(d,s){deck=d;side=s;const D=DECKS[d];len=s=='A'?48:64;notes=[];let l=1;
 for(let b=4;b<len;b++){const dens=s=='A'?.7:.9;if(Math.random()<dens){l=Math.max(0,Math.min(2,l+(Math.random()*3|0)-1));notes.push({b,l,k:Math.random()<(s=='B'?.18:.1)?'tangle':'note',p:SCALE[Math.random()*SCALE.length|0]})}
  if(s=='B'&&Math.random()<.25&&b+.5<len){notes.push({b:b+.5,l:Math.max(0,Math.min(2,l+(Math.random()<.5?-1:1))),k:'note',p:SCALE[Math.random()*7|0]})}}
 notes=notes.filter((n,i,a)=>!(n.k=='tangle'&&a.some(m=>m!==n&&m.b==n.b&&m.k=='note'&&m.l==n.l)));
 beat=-2;songT=0;stretch=0;score=0;combo=0;hits=0;misses=0;lastBeat=-3;rewound=false;lane=1;state='play'}
function rate(){return 1-stretch*.55}
function shift(dl){if(state!='play')return;const nl=lane+dl;if(nl<0||nl>2)return;lane=nl;
 const ph=Math.abs(beat*2-Math.round(beat*2));if(ph<.18){shiftFlash=10;score+=5}tone(300+lane*80,.04,'triangle',.03)}
let last=0;
function update(dt){if(state!='play')return;const D=DECKS[deck],bps=D.bpm/60;beat+=dt*bps*rate();
 const wb=Math.floor(beat);if(wb>lastBeat){lastBeat=wb;tone(60,.12,'sine',.25*rate()+.05);if(wb%2)tone(2000,.03,'square',.01)}
 for(const n of notes){if(n.done)continue;const d=n.b-beat;
  if(Math.abs(d)<.18&&n.l==lane){n.done=true;if(n.k=='note'){hits++;combo++;score+=10*(1+Math.floor(combo/8));stretch=Math.max(0,stretch-.02);tone(440*Math.pow(2,n.p/12)*(1-stretch*.25),.15,'square',.05);for(let i=0;i<8;i++)particles.push({x:180+(LX[lane]-180)*.81,y:CY,vx:Math.random()*4-2,vy:-Math.random()*4,t:25,c:D.c})}
   else{miss(.12);tone(90,.25,'sawtooth',.08)}}
  else if(d<-.18){n.done=true;if(n.k=='note'){miss(.07)}}}

 if(beat>len+1)end(true)}
function miss(a){misses++;combo=0;stretch=Math.min(1,stretch+a);tone(120*(1-stretch*.3),.2,'sawtooth',.04)}
function end(ok){state=ok?'clear':'over';const total=notes.filter(n=>n.k=='note').length;
 if(ok&&side=='B'&&deck+1<DECKS.length&&save.unlocked<deck+2)save.unlocked=deck+2;if(score>save.best)save.best=score;localStorage.tddSave=JSON.stringify(save);tracks++;window._acc=Math.round(hits/Math.max(1,total)*100)}
async function rewind(take){if(take){const ok=await RunAds.showRewarded();if(ok){stretch=.3;rewound=true;state='play';return}}rewound=true;end(false)}
async function toMenu(){if(tracks%2==0)await RunAds.showInterstitial();state='menu'}

  for(let k=0;k<3;k++){const a=t+k*2.094;g.beginPath();g.moveTo(cx+Math.cos(a)*rad*.2,y+w*.33+Math.sin(a)*rad*.2);g.lineTo(cx+Math.cos(a)*rad*.6,y+w*.33+Math.sin(a)*rad*.6);g.stroke()}}

function shade(c){const n=parseInt(c.slice(1),16);return '#'+[16,8,0].map(s=>Math.floor(((n>>s)&255)*.55).toString(16).padStart(2,'0')).join('')}

  cassette(80,250+Math.sin(tk/20)*4,200,D.c,D.c2,false,tk/10);txt('TAPE DECK',180,90,'#fff',38,14);txt('DRIFT',180,135,'#3de0ff',38,16);

  if(Math.sin(tk/15)>0)txt('TAP OR PRESS SPACE',180,550,'#ffd23d',16,10);txt('v'+VERSION+'  Best '+save.best,180,580,'#bbb',12);txt('Made by Arthur McConnell / Retro Gaming Dad',180,620,'#ff4fa3',11);crt();return requestAnimationFrame(draw)}
 if(state=='menu'){g.fillStyle='rgba(20,5,40,.88)';g.fillRect(0,0,W,H);txt('PICK A TAPE',180,70,'#fff',26,12);txt('Clear a B-side to unlock the next deck',180,100,'#ffd23d',11);
  menuItems().forEach((m,i)=>{const bx=i%2?190:30,by=170+(i>>1)*110,d=DECKS[m.d],on=i==menuSel;

  txt('Made by Arthur McConnell / Retro Gaming Dad',180,620,'#ff4fa3',11);crt();return requestAnimationFrame(draw)}
 // ground + neon grid
 const wob=Math.sin(tk/6)*stretch*14;
 g.fillStyle='#12041f';g.fillRect(0,222,W,H-222);
 g.strokeStyle=D.c2;g.globalAlpha=.25;g.lineWidth=1;for(let i=0;i<12;i++){const f=((i+beat)%12)/12,yy=222+f*f*418;g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke()}g.globalAlpha=1;
 // tape ribbon road
 const rg=g.createLinearGradient(0,220,0,H);rg.addColorStop(0,'#2a1408');rg.addColorStop(1,'#6b3b22');g.fillStyle=rg;g.beginPath();g.moveTo(150+wob,220);g.lineTo(210+wob,220);g.lineTo(340,H);g.lineTo(20,H);g.fill();
 g.strokeStyle=D.c;g.lineWidth=3;g.shadowColor=D.c;g.shadowBlur=10+pulse*14;g.beginPath();g.moveTo(150+wob,220);g.lineTo(20,H);g.moveTo(210+wob,220);g.lineTo(340,H);g.stroke();g.shadowBlur=0;
 g.fillStyle='rgba(255,200,150,.12)';for(let i=0;i<14;i++){const f=((i+beat*1)%14)/14,yy=220+f*f*420;g.fillRect(20,yy,320,1+f*2)}
 const proj=(l,b)=>{const d=b-beat,y=CY-d*90;const t=Math.max(0,(y-220)/(H-220));return{x:180+wob*(1-t)+(LX[l]-180)*(.2+.8*t),y,s:.3+.7*t}};
 for(let l=0;l<LN-1;l++){const ex=(LX[l]+LX[l+1])/2;g.strokeStyle='rgba(255,255,255,.18)';g.setLineDash([10,14]);g.lineDashOffset=-beat*24;g.lineWidth=2;g.beginPath();g.moveTo(180+wob+(ex-180)*.2,220);g.lineTo(180+(ex-180),H);g.stroke();g.setLineDash([])}
 // hit line
 g.strokeStyle=`rgba(255,255,255,${.25+pulse*.5})`;g.lineWidth=2;g.beginPath();g.moveTo(40,CY);g.lineTo(320,CY);g.stroke();
 for(const n of notes){if(n.done)continue;const d=n.b-beat;if(d>3.6||d<-.5)continue;const p=proj(n.l,n.b);
  if(n.k=='note'){const c=n.b%1?D.c2:D.c;g.shadowColor=c;g.shadowBlur=12;g.fillStyle=c;g.beginPath();g.ellipse(p.x,p.y,14*p.s,11*p.s,-.3,0,7);g.fill();g.fillRect(p.x+10*p.s,p.y-32*p.s,4*p.s,32*p.s);
   g.beginPath();g.moveTo(p.x+14*p.s,p.y-32*p.s);g.quadraticCurveTo(p.x+26*p.s,p.y-24*p.s,p.x+22*p.s,p.y-12*p.s);g.lineTo(p.x+20*p.s,p.y-14*p.s);g.quadraticCurveTo(p.x+22*p.s,p.y-22*p.s,p.x+14*p.s,p.y-26*p.s);g.fill();g.shadowBlur=0;
   g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(p.x-4*p.s,p.y-3*p.s,4*p.s,2.5*p.s,-.3,0,7);g.fill()}
  else{g.strokeStyle='#4a2a1a';g.lineWidth=6*p.s;g.beginPath();for(let i=0;i<12;i++)g.lineTo(p.x-24*p.s+i*4.4*p.s,p.y+Math.sin(i*1.7+tk/3)*10*p.s);g.stroke();
   g.strokeStyle='#c98a5a';g.lineWidth=2*p.s;g.beginPath();for(let i=0;i<12;i++)g.lineTo(p.x-24*p.s+i*4.4*p.s,p.y+Math.cos(i*1.3+tk/4)*12*p.s);g.stroke();
   g.fillStyle='#ff3d3d';g.font='bold '+(14*p.s|0)+'px Courier New';g.fillText('✕',p.x,p.y-14*p.s)}}
 // car = mini cassette

 // HUD (cassette-deck panel)
